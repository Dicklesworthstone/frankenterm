name: Windows Check

# [win-compat][P0] (ft-f2gx8): proof-of-feasibility + standing regression guard
# for Windows support. Build-only `cargo check` against x86_64-pc-windows-msvc;
# no Windows runtime is exercised here. Starts as continue-on-error (informational)
# while the tree is driven green under ft-5fmt3; flip `continue-on-error` to false
# (make it required) once it passes, to lock in the additive, no-Mac/Linux-regression
# Windows-compat invariant.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  # ft-51fde — fast, build-free static guard: fail on NEW unconditional Unix
  # couplings (std::os::unix / std::os::fd, or unix-only crate deps) outside
  # #[cfg(unix)] gates. Complements the cargo-check job below (the authoritative
  # compile gate) by catching the common mistake without a full Windows toolchain
  # build, and by covering #[cfg(test)] code that `cargo check` does not typecheck
  # on Windows. This job builds nothing, so it is required from day one.
  unix-coupling-lint:
    name: unix-coupling ratchet (ft-51fde)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: No new unconditional Unix couplings
        shell: bash
        run: scripts/check_windows_unix_coupling.sh

  windows-check:
    name: cargo check (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          # ft-x1klc: bumped windows-check -> windows-check-v2 to bust the stale
          # cache that masked the openssl-sys build-script failure (a cached
          # openssl-sys artifact made a clean failure look green). Never trust a
          # lone green for a `-sys` crate behind a warm cache.
          key: windows-check-v2

      # ft-x1klc: with openssl's `vendored` feature gated OFF on Windows (Mac stays
      # vendored, Linux stays system), openssl-sys must find a *system* OpenSSL.
      # windows-latest ships vcpkg at $VCPKG_INSTALLATION_ROOT but does NOT pre-build
      # openssl, so provision it here and point openssl-sys at it via OPENSSL_DIR.
      # Triplet x64-windows-static-md = static OpenSSL libs against the dynamic CRT
      # (-md), which matches the default Rust MSVC runtime; OPENSSL_STATIC=1 tells
      # openssl-sys to link those static libs. Exported to $GITHUB_ENV so both the
      # default- and no-default-features cargo checks below inherit it.
      - name: Provision OpenSSL (vcpkg)
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:x64-windows-static-md
          OPENSSL_ROOT="$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md"
          echo "OPENSSL_DIR=$OPENSSL_ROOT" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "Provisioned OpenSSL at $OPENSSL_ROOT"
          ls -la "$OPENSSL_ROOT/lib" || true

      - name: Environment info
        shell: bash
        run: |
          echo "## Windows Check environment" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rustc --version --verbose >> "$GITHUB_STEP_SUMMARY"
          cargo --version >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Default features: INFORMATIONAL (continue-on-error) — and staying that way until
      # the Windows GUI-backend port lands. The default (full-GUI) feature set pulls the
      # Linux/X11 GUI C-dependency stack (cairo-sys-rs, and transitively pango/gdk/
      # fontconfig), which cannot build on windows-msvc ("Could not run pkg-config ...
      # cairo"). These are the same class as the openssl/jemalloc `-sys` blockers but
      # deeper: a real Windows-GUI port (gate the Linux GUI stack off Windows / wire the
      # Windows GUI backend) is required, tracked under ft-azsnz P2. A single earlier
      # 386db8abb "success" was not reproducible (build-order/cache; cairo fails on a
      # clean traversal). DO NOT require this until a Windows GUI backend exists and a
      # clean run is green over multiple attempts. The only REQUIRED guard today is the
      # unix-coupling ratchet (build-free, proven). The --no-default-features check below
      # (Windows CORE compiles) is the next milestone to promote to required — but only
      # after it is confirmed green on a clean run (it was skipped while default-features
      # failed first; this revert lets it actually run again).
      - name: cargo check --workspace (default features)
        id: check_default
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/ci-logs
          cargo check --workspace --target x86_64-pc-windows-msvc 2>&1 \
            | tee target/ci-logs/windows-check-default.log

      # Minimal feature set is the most likely to compile first; tracks the
      # "compiles with --no-default-features" milestone from the feasibility study.
      - name: cargo check --workspace --no-default-features
        id: check_minimal
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/ci-logs
          cargo check --workspace --no-default-features --target x86_64-pc-windows-msvc 2>&1 \
            | tee target/ci-logs/windows-check-minimal.log

      - name: Summarize remaining Windows blockers
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows cargo check — remaining blockers"
            echo "default-features: ${{ steps.check_default.outcome }}"
            echo "no-default-features: ${{ steps.check_minimal.outcome }}"
            echo ""
            echo "### Distinct error[E] lines (default features)"
            echo '```'
            grep -hoE 'error\[E[0-9]+\]' target/ci-logs/windows-check-default.log 2>/dev/null | sort | uniq -c | sort -rn | head -40 || echo "(none / log missing)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Windows check logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-check-logs
          path: target/ci-logs/windows-check-*.log
          if-no-files-found: ignore
