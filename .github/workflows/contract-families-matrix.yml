name: Contract Families Matrix

on:
  push:
    branches: [main]
    paths:
      - "crates/frankenterm-core/src/context_horizon.rs"
      - "crates/frankenterm-core/src/capture_fairness*.rs"
      - "crates/frankenterm-core/src/herd_wave*.rs"
      - "crates/frankenterm-core/src/blocker_radar*.rs"
      - "crates/frankenterm-core/src/resource_*.rs"
      - "crates/frankenterm-core/src/mcp.rs"
      - "crates/frankenterm-core/src/robot_api_contracts.rs"
      - "crates/frankenterm-core/tests/conformance_robot_api_surface_coverage.rs"
      - "crates/frankenterm-core/tests/conformance_robot_envelope_schema.rs"
      - "crates/frankenterm-core/tests/control_plane_golden_matrix.rs"
      - "crates/frankenterm-core/tests/golden_robot_envelope/**"
      - "crates/frankenterm-core/tests/contract_families_*.rs"
      - "docs/contract-families-cross-invariants.md"
      - "docs/attestations/contracts/cross-family-matrix.json"
      - "docs/attestations/manifest.json"
      - "docs/attestations/proofs/robot-contract-doctor.json"
      - "docs/robot-contracts/**"
      - "docs/security/policy-denial-audit-wiring-matrix.md"
      - "docs/security/read-path-redaction-matrix.md"
      - "scripts/check-contract-doctor-coverage.sh"
  pull_request:
    branches: [main]
    paths:
      - "crates/frankenterm-core/src/context_horizon.rs"
      - "crates/frankenterm-core/src/capture_fairness*.rs"
      - "crates/frankenterm-core/src/herd_wave*.rs"
      - "crates/frankenterm-core/src/blocker_radar*.rs"
      - "crates/frankenterm-core/src/resource_*.rs"
      - "crates/frankenterm-core/src/mcp.rs"
      - "crates/frankenterm-core/src/robot_api_contracts.rs"
      - "crates/frankenterm-core/tests/conformance_robot_api_surface_coverage.rs"
      - "crates/frankenterm-core/tests/conformance_robot_envelope_schema.rs"
      - "crates/frankenterm-core/tests/control_plane_golden_matrix.rs"
      - "crates/frankenterm-core/tests/golden_robot_envelope/**"
      - "crates/frankenterm-core/tests/contract_families_*.rs"
      - "docs/contract-families-cross-invariants.md"
      - "docs/attestations/contracts/cross-family-matrix.json"
      - "docs/attestations/manifest.json"
      - "docs/attestations/proofs/robot-contract-doctor.json"
      - "docs/robot-contracts/**"
      - "docs/security/policy-denial-audit-wiring-matrix.md"
      - "docs/security/read-path-redaction-matrix.md"
      - "scripts/check-contract-doctor-coverage.sh"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  matrix:
    name: Cross-family + Robot/MCP Contract Doctor verdict
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: contract-families-matrix

      - name: Install Linux workspace build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev libx11-dev libx11-xcb-dev libxcb-util-dev libxcb-image0-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config

      - name: Robot/MCP Contract Doctor static verdict
        run: bash scripts/check-contract-doctor-coverage.sh

      - name: Robot/MCP Contract Doctor attestation slot
        run: |
          jq -e '
            .slots[]
            | select(.category == "proofs/robot-contracts")
            | select(.path == "docs/attestations/proofs/robot-contract-doctor.json")
            | select(.produced_by_bead == "ft-7h5da.13.7")
            | select(.proof_categories | index(4))
          ' docs/attestations/manifest.json
          jq -e '
            .category == "proofs/robot-contracts"
            and .produced_by_bead == "ft-7h5da.13.7"
            and .overall_status == "pass_with_tracked_exceptions"
            and (.ci_verdict.workflow == ".github/workflows/contract-families-matrix.yml")
          ' docs/attestations/proofs/robot-contract-doctor.json

      - name: Robot/MCP Contract Doctor cargo verdict
        run: cargo test -p frankenterm-core --lib robot_api_contracts -- --nocapture

      - name: Cross-family contract matrix
        run: |
          cargo test -p frankenterm-core \
            --test contract_families_invariant_parser \
            --test contract_families_integration_matrix \
            -- --nocapture
