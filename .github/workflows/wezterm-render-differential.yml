name: WezTerm Render Differential

on:
  schedule:
    - cron: "42 8 * * *"
  workflow_dispatch:
    inputs:
      comparison_report:
        description: "Optional repo-relative comparison report to gate"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: wezterm-render-differential-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate WezTerm render differential report
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RUN_DIR: target/wezterm-differential
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: wezterm-render-differential

      - name: Fetch upstream WezTerm HEAD
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR"
          upstream_src="$RUNNER_TEMP/wezterm-upstream-src-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone \
            --branch main \
            --depth=1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/wez/wezterm.git \
            "$upstream_src"
          git -C "$upstream_src" rev-parse HEAD | tee "$RUN_DIR/upstream-wezterm-head.txt"
          echo "WEZTERM_UPSTREAM_SRC=$upstream_src" >> "$GITHUB_ENV"

      - name: Build FrankenTerm GUI
        run: |
          set -euo pipefail
          cargo build -p frankenterm-gui --bin frankenterm-gui
          echo "FRANKENTERM_GUI=$PWD/target/debug/frankenterm-gui" >> "$GITHUB_ENV"

      - name: Build upstream WezTerm GUI
        run: |
          set -euo pipefail
          upstream_src="${WEZTERM_UPSTREAM_SRC:?WEZTERM_UPSTREAM_SRC must be set by Fetch upstream WezTerm HEAD}"
          cargo build --manifest-path "$upstream_src/Cargo.toml" -p wezterm-gui --bin wezterm-gui
          echo "WEZTERM_GUI=$upstream_src/target/debug/wezterm-gui" >> "$GITHUB_ENV"

      - name: Validate differential gate self-test
        run: scripts/wezterm-render-differential.sh --self-test

      - name: Export frame comparison report
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.comparison_report == '' }}
        timeout-minutes: 45
        run: |
          set -euo pipefail
          scripts/wezterm-render-comparison-macos.sh \
            --frankenterm-gui "$FRANKENTERM_GUI" \
            --wezterm-gui "$WEZTERM_GUI" \
            --frame-root "$RUN_DIR/frames" \
            --output "$RUN_DIR/comparison-report.json"

      - name: Gate supplied comparison report
        env:
          COMPARISON_REPORT: ${{ inputs.comparison_report }}
        run: |
          set -euo pipefail
          upstream_ref="$(cat "$RUN_DIR/upstream-wezterm-head.txt")"
          comparison_report="${COMPARISON_REPORT:-$RUN_DIR/comparison-report.json}"
          if [ ! -s "$comparison_report" ]; then
            echo "::error title=WezTerm comparison report missing::Expected $comparison_report to contain schema_version=wezterm-render-comparison.v1 with comparisons[]."
            exit 1
          fi
          scripts/wezterm-render-differential.sh \
            --comparison-report "$comparison_report" \
            --upstream-ref "$upstream_ref" \
            --output "$RUN_DIR/wezterm-divergence.json"

      - name: Upload differential artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wezterm-render-differential
          path: |
            target/wezterm-differential/
          if-no-files-found: ignore
          retention-days: 14
