# Cx-Propagation Burn-Down Weekly Cron (ft-qfgbw / BR-RC-RUNTIME-SEMANTICS.G14.2.cont.cron)
#
# Runs scripts/cx_propagation_burndown.py once per week to refresh the
# snapshot at docs/runtime/cx-propagation.json and append a trend row
# to docs/runtime/cx-propagation-trend.jsonl. Commits both files back
# to main with a deterministic message so the burn-down curve gets a
# regular temporal datapoint.
#
# Per-PR --check enforcement is wired separately in
# .github/workflows/finish-line-guards.yml (br-ft-gsgll). This cron
# does NOT --check; it only records.
#
# Author identity: github-actions[bot]. The default GITHUB_TOKEN is
# scoped to `contents: write` on this workflow only — sufficient to
# push the snapshot/trend commit on main.
#
# Cross-references:
# - scripts/cx_propagation_burndown.py
# - docs/runtime/cx-propagation-burndown.md  (operating cadence section)
# - ft-t9a6q.2  (parent — substrate)
# - ft-gsgll    (per-PR --check gate, already shipped)

name: cx-propagation burn-down (weekly cron)

on:
  schedule:
    # Mondays 09:00 UTC. Picks a quiet window before the US/EU work week.
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cx-propagation-burndown-cron
  cancel-in-progress: false

jobs:
  snapshot-and-append:
    name: Snapshot + trend append
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Need a real ref so we can commit + push on main.
          ref: main
          # Fetch full history so the bot's commit lands on top of the
          # current main rather than a detached shallow clone.
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run burn-down generator (snapshot + trend append)
        run: python3 scripts/cx_propagation_burndown.py --print-summary

      - name: Commit and push if changed
        env:
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Stage only the two files the generator owns. Keeps the
          # commit shape predictable even if a future change adds
          # adjacent generated files.
          git add docs/runtime/cx-propagation.json docs/runtime/cx-propagation-trend.jsonl

          if git diff --cached --quiet; then
            echo "cx-propagation: no changes to commit"
            exit 0
          fi

          git commit -m "chore(cx-propagation): weekly burn-down snapshot $(date -u +%Y-%m-%d)" \
            -m "Generated by .github/workflows/cx-propagation-burndown-cron.yml (ft-qfgbw)."
          git push origin HEAD:main
