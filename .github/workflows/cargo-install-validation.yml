name: Cargo Install Validation

on:
  push:
    branches: [main]
    paths:
      - 'crates/frankenterm/**'
      - 'crates/frankenterm-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/cargo-install-validation.yml'
  workflow_dispatch:
    inputs:
      git_url:
        description: Git URL to validate (defaults to the current repository)
        required: false
        type: string
      git_ref:
        description: Commit, tag, or branch to install (defaults to the triggering SHA)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-install:
    name: Cargo Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cargo-install-linux-amd64
          - os: macos-14
            artifact: cargo-install-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-install-${{ matrix.os }}

      # On macOS, ensure the system C compiler is used (not aliases).
      # On Ubuntu, install system deps for native crate compilation.
      - name: Platform-specific setup
        shell: bash
        run: |
          case "$(uname -s)" in
            Darwin)
              echo "CC=$(xcrun --find clang)" >> "$GITHUB_ENV"
              echo "CXX=$(xcrun --find clang++)" >> "$GITHUB_ENV"
              ;;
            Linux)
              sudo apt-get update -qq
              sudo apt-get install -y -qq cmake pkg-config libssl-dev
              ;;
          esac

      - name: Run cargo install validation (path mode)
        env:
          FT_INSTALL_SOURCE: path
          FT_INSTALL_PATH: ${{ github.workspace }}/crates/frankenterm
          E2E_ARTIFACTS_BASE: ${{ github.workspace }}/e2e-artifacts
        run: bash tests/e2e/test_ft_gofz5_1_cargo_install.sh

      - name: Upload cargo install artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: e2e-artifacts/**
          if-no-files-found: ignore
