name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel releases

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RCH_GITHUB_ACTIONS_LOCAL_CARGO: "1"

jobs:
  high-scale-evidence-gate:
    name: High-scale release evidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-high-scale-evidence

      - name: Verify high-scale evidence scoreboard
        run: |
          cargo test -p frankenterm-core --test large_swarm_replay_corpus release_evidence --no-default-features

  build:
    name: Build ${{ matrix.target }}
    needs: high-scale-evidence-gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ft
            asset: ft-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: ft
            asset: ft-linux-arm64
          # x86_64-apple-darwin (Intel Mac) is intentionally excluded: ort-sys
          # (pulled in via fastembed → semantic-search default feature) does not
          # publish prebuilt ONNX Runtime binaries for that target, and building
          # ORT from source on each release would balloon CI time. macOS users
          # on Apple Silicon are covered by aarch64-apple-darwin; Intel Mac
          # users can build from source with `--no-default-features` or
          # `--features ...` minus `semantic-search`.
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: ft
            asset: ft-darwin-arm64
          # x86_64-pc-windows-msvc is intentionally excluded from v0.2.0:
          # frankenterm-core depends on Unix-only primitives across many
          # modules (`crate::ipc` / `fd_budget` / `mux_pool` / `PaneDelta`
          # vendored exports, `send_unix_signal_to_pid`,
          # `asupersync::net::UnixListener` / `UnixStream`) plus several
          # additional `Cx::register_io` + `FileDescriptor::into_raw_socket`
          # callsites that all assume a POSIX fd model. Properly porting
          # those — instead of patching them one-by-one as each Windows
          # build round exposes the next — is a substantial engineering
          # effort that belongs in its own release. Once those modules are
          # actually cfg-portable on Windows, re-enable this matrix entry.
          # Tracking: file Windows-port follow-up bead before next release.
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   artifact: ft.exe
          #   asset: ft-windows-amd64.exe
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0  # Full history for version metadata
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux workspace build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev libx11-dev libx11-xcb-dev libxcb-util-dev libxcb-image0-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config

      - name: Install Windows OpenSSL build Perl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Strawberry\perl\bin\perl.exe")) {
            choco install strawberryperl --no-progress -y
          }
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release binary
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          # Windows-specific build flags:
          #   1. `-p frankenterm --bin ft` — Windows release ships only the
          #      `ft` CLI for now. The GUI (frankenterm-gui) pulls in
          #      cairo-rs/cairo-sys-rs via frankenterm-font, which needs
          #      pkg-config Cairo on the build host — impractical on the
          #      MSVC GitHub runner. Building the full workspace would also
          #      drag in jemalloc and other Unix-only build scripts.
          #   2. `--no-default-features --features ...` minus `jemalloc` —
          #      tikv-jemalloc-sys's autoconf build script can't produce
          #      executables under MSVC. System allocator instead.
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cargo build --release --target ${{ matrix.target }} \
              -p frankenterm --bin ft \
              --no-default-features \
              --features browser,distributed,vendored,mcp,metrics,native-wezterm,semantic-search,subprocess-bridge,sync,ftui,tui-dashboard,tui-widgets,web,redis-session,asupersync-runtime
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Smoke test binary (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          echo "=== ft --version ==="
          "$BINARY" --version
          echo "=== ft version --full ==="
          "$BINARY" version --full
          echo "=== ft --help ==="
          "$BINARY" --help
          # `ft doctor --json` exits non-zero whenever it finds any environmental
          # problem (missing WezTerm install, no agent-mail, etc.) — all of
          # which are expected on a vanilla CI runner. Capture and inspect the
          # output but don't gate the smoke test on its exit code: we only
          # care that the binary launches, parses args, and emits valid JSON.
          echo "=== ft doctor --json (informational) ==="
          # stderr goes to console for diagnostics, stdout is the JSON we
          # validate. Redirecting 2>&1 would interleave tracing logs
          # ("INFO ft: Workspace resolved …") with the JSON body, breaking
          # the strict json.loads parse below.
          set +e
          DOCTOR_OUTPUT="$("$BINARY" doctor --json 2>/dev/null)"
          DOCTOR_EXIT=$?
          set -e
          echo "$DOCTOR_OUTPUT" | head -30
          echo "ft doctor exit code: $DOCTOR_EXIT (non-zero is acceptable in CI environments without backends installed)"
          # Validate the JSON body parses — catches panic-at-startup or
          # malformed-output regressions while letting the doctor's
          # environmental checks correctly flag missing backends.
          echo "$DOCTOR_OUTPUT" | python3 -c "import json,sys; json.loads(sys.stdin.read())"
          echo "=== All smoke tests passed ==="

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Default pwsh invocation by GitHub Actions does NOT set $ErrorActionPreference
          # nor $PSNativeCommandUseErrorActionPreference, so a non-zero exit from ft.exe
          # sets $LASTEXITCODE but does NOT terminate the script. We opt in explicitly
          # so a panic-at-startup or crash-on-help regression aborts the workflow.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $binary = "target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          Write-Host "=== ft --version ==="
          & $binary --version
          Write-Host "=== ft version --full ==="
          & $binary version --full
          Write-Host "=== ft --help ==="
          & $binary --help
          # `ft doctor --json` is informational on Windows CI: non-zero exit
          # is expected when the runner has no FrankenTerm/WezTerm install or
          # agent-mail. We only assert that the binary emits parseable JSON,
          # which catches launch panics / arg-parse regressions but doesn't
          # gate on environmental gaps the doctor correctly reports.
          Write-Host "=== ft doctor --json (informational) ==="
          # Capture stdout only — stderr (tracing logs) would mix into the
          # captured stream and break the json.loads validation below.
          $PSNativeCommandUseErrorActionPreference = $false
          $doctorOutput = & $binary doctor --json 2>$null | Out-String
          $doctorExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host ($doctorOutput.Substring(0, [Math]::Min(2000, $doctorOutput.Length)))
          Write-Host "ft doctor exit code: $doctorExit (non-zero acceptable in CI)"
          $doctorOutput | python -c "import json,sys; json.loads(sys.stdin.read())"
          Write-Host "=== All smoke tests passed ==="

      - name: Create tarball (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          tar -cJf ../../../dist/${{ matrix.asset }}.tar.xz ${{ matrix.artifact }}
          cd ../../../dist
          shasum -a 256 "${{ matrix.asset }}.tar.xz" > "${{ matrix.asset }}.tar.xz.sha256"

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact }}" -DestinationPath "dist/${{ matrix.asset }}.zip"
          cd dist
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}.zip").Hash.ToLower()
          "$hash  ${{ matrix.asset }}.zip" | Out-File -Encoding ASCII "${{ matrix.asset }}.zip.sha256"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: List artifacts
        run: ls -la dist/

      - name: Create combined checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          echo "## Release Checksums" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate build provenance attestations
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          # Attest every file a downloader might trust: the binary archives AND the
          # checksum artifacts that key archive verification. Without attesting
          # SHA256SUMS + *.sha256, an attacker who compromises the release step
          # (but not the attestation step) could re-point the manifest at a
          # different archive that still has its original valid attestation.
          subject-path: |
            dist/*.tar.xz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS

      # ── Refresh per-release perf/atlas-packing artifact (ft-gtcm9.5) ──────────
      # Re-runs the atlas_packing_attestation example so the JSON snapshot at
      # docs/perf/atlas-packing.json reflects HEAD's packer behaviour for this
      # tag, then attestation-build.sh hashes it into the bundle.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-attestation-prebuild
      - name: Refresh atlas-packing attestation artifact
        run: |
          set -euo pipefail
          cargo run --release --quiet \
            -p frankenterm-core \
            --example atlas_packing_attestation \
            --no-default-features \
            > docs/perf/atlas-packing.json
          # Sanity: artifact must be valid JSON with at least one result.
          python3 -c 'import json,sys; d=json.load(open("docs/perf/atlas-packing.json")); assert isinstance(d.get("results"),list) and d["results"], "atlas-packing attestation: empty or malformed"; print(f"atlas-packing: {len(d[\"results\"])} (corpus,packer) entries")'

      # ── Refresh per-release perf/lindley-bounds artifact (ft-jfyz7) ───────────
      # Re-runs the lindley_bounds_build example via the wrapper script so
      # docs/attestations/perf/lindley-bounds.json reflects HEAD's analytical
      # bound vs the supplied empirical_p99_ms. attestation-build.sh hashes it
      # into the perf/lindley-bounds slot of the bundle, and the existing
      # cosign step at the next anchor signs the bundle as a whole — so this
      # one step covers both ft-jfyz7 sub-tasks 1 (refresh from telemetry +
      # bench p99) and 2 (signing through the existing cosign path).
      #
      # Tolerance gate: the wrapper exits 1 when deviation_pct > 20%, which
      # fails this step and aborts the release before the bundle is signed —
      # the analytical-vs-empirical drift gate the bead requires.
      #
      # FT_LINDLEY_EMPIRICAL_P99_MS may be supplied by an upstream bench job;
      # absent that, the example uses the documented fallback (8.5 ms) per
      # docs/perf/latency-derivation.md, which keeps the release runnable
      # while ft-jfyz7 sub-task 3 (bench → env wiring) remains open.
      - name: Refresh lindley-bounds attestation artifact
        env:
          FT_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/lindley-bounds-build.sh
          # Sanity: artifact must be valid JSON with the canonical schema fields
          # the substrate's render_attestation_json emits.
          python3 -c 'import json; d=json.load(open("docs/attestations/perf/lindley-bounds.json")); req={"release_version","arrival","stages","analytical_bound_ms","empirical_p99_ms"}; missing=req-set(d); assert not missing, f"lindley-bounds attestation: missing fields {missing}"; print(f"lindley-bounds: release_version={d[\"release_version\"]} analytical_bound_ms={d[\"analytical_bound_ms\"]} empirical_p99_ms={d[\"empirical_p99_ms\"]} stages={len(d[\"stages\"])}")'

      # ── Reality-check attestation bundle (ft-syqcz.1) ──────────────────────────
      # Distinct from actions/attest above (which signs the binary archives). This
      # bundle signs the per-release manifest of perf/security/proof/doctrine
      # artifacts that back every README claim. See docs/attestations/README.md.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Build + sign reality-check attestation bundle
        env:
          COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          # Channel: pre-release tags (anything with '-') ride the 'beta' channel; everything else 'stable'.
          if [[ "${{ steps.version.outputs.tag }}" == *-* ]]; then channel=beta; else channel=stable; fi
          scripts/attestation-build.sh \
            --version "${{ steps.version.outputs.version }}" \
            --channel "$channel" \
            --sign cosign \
            --strict-deferred
          # Verify what we just built; CI fails the release if anything diverges.
          scripts/attestation-verify.sh \
            "docs/attestations/${{ steps.version.outputs.version }}.json" \
            --strict-required \
            --strict-deferred
          # Stage attestation files alongside the binary archives so they ship with the release.
          cp \
            "docs/attestations/${{ steps.version.outputs.version }}.json" \
            "docs/attestations/${{ steps.version.outputs.version }}.sigstore" \
            "docs/attestations/${{ steps.version.outputs.version }}.canonical.json" \
            "docs/attestations/schema.json" \
            "docs/attestations/SIGNING.md" \
            dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
