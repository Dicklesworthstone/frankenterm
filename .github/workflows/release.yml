name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel releases

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ft
            asset: ft-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: ft
            asset: ft-linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: ft
            asset: ft-darwin-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: ft
            asset: ft-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ft.exe
            asset: ft-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version metadata
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        env:
          SOURCE_DATE_EPOCH: "0"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test binary (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          echo "=== ft --version ==="
          "$BINARY" --version
          echo "=== ft version --full ==="
          "$BINARY" version --full
          echo "=== ft --help ==="
          "$BINARY" --help
          echo "=== ft doctor --json ==="
          "$BINARY" doctor --json
          echo "=== All smoke tests passed ==="

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Default pwsh invocation by GitHub Actions does NOT set $ErrorActionPreference
          # nor $PSNativeCommandUseErrorActionPreference, so a non-zero exit from ft.exe
          # sets $LASTEXITCODE but does NOT terminate the script — the final Write-Host
          # would then exit 0 and a Windows-only regression (panic at startup, crash on
          # --help, non-zero `ft doctor --json`) would ship to release without the
          # workflow catching it. The Unix step at the top gets `set -eo pipefail`
          # implicitly from Actions' default bash args; we have to opt in explicitly
          # for pwsh. `$PSNativeCommandUseErrorActionPreference` is PowerShell 7.3+;
          # Windows GHA runners ship pwsh 7.4+.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $binary = "target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          Write-Host "=== ft --version ==="
          & $binary --version
          Write-Host "=== ft version --full ==="
          & $binary version --full
          Write-Host "=== ft --help ==="
          & $binary --help
          Write-Host "=== ft doctor --json ==="
          & $binary doctor --json
          Write-Host "=== All smoke tests passed ==="

      - name: Create tarball (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          tar -cJf ../../../dist/${{ matrix.asset }}.tar.xz ${{ matrix.artifact }}
          cd ../../../dist
          shasum -a 256 "${{ matrix.asset }}.tar.xz" > "${{ matrix.asset }}.tar.xz.sha256"

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact }}" -DestinationPath "dist/${{ matrix.asset }}.zip"
          cd dist
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}.zip").Hash.ToLower()
          "$hash  ${{ matrix.asset }}.zip" | Out-File -Encoding ASCII "${{ matrix.asset }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: List artifacts
        run: ls -la dist/

      - name: Create combined checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          echo "## Release Checksums" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate build provenance attestations
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          # Attest every file a downloader might trust: the binary archives AND the
          # checksum artifacts that key archive verification. Without attesting
          # SHA256SUMS + *.sha256, an attacker who compromises the release step
          # (but not the attestation step) could re-point the manifest at a
          # different archive that still has its original valid attestation.
          subject-path: |
            dist/*.tar.xz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
