name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly reality-check lane for GPU renderer parity artifacts.
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint-${{ matrix.os }}

      - name: Environment info
        run: |
          echo "## Environment" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          rustc --version --verbose >> $GITHUB_STEP_SUMMARY
          cargo --version >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check formatting
        run: |
          set -eo pipefail
          mkdir -p target/ci-logs
          cargo fmt --all -- --check 2>&1 | tee target/ci-logs/lint-format.log

      - name: Clippy (default features)
        run: |
          set -eo pipefail
          mkdir -p target/ci-logs
          cargo clippy --workspace --all-targets -- -D warnings -D clippy::all 2>&1 | tee target/ci-logs/lint-clippy-default.log

      - name: Clippy (with optional features)
        run: |
          set -eo pipefail
          mkdir -p target/ci-logs
          cargo clippy --workspace --all-targets --features tui-oracle,ftui,rollout,mcp,browser,web,metrics,distributed -- -D warnings -D clippy::all 2>&1 | tee target/ci-logs/lint-clippy-optional.log

      - name: Compile benches (frankenterm-core)
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench -p frankenterm-core --benches --no-run

      - name: Upload lint logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-logs-${{ matrix.os }}
          path: |
            target/ci-logs/**/*.log
            target/**/*.stderr
            target/**/*.stdout
          if-no-files-found: ignore
          retention-days: 7

  generated-artifacts:
    name: Generated Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Regenerate docs/types and check drift
        run: scripts/check_generated_artifacts.sh

      # ft-zoxxq.4 — fail CI if any new file outside the mux module
      # introduces `dyn MuxInterface` / `dyn WeztermInterface`. Codifies
      # the wezterm-fork stance from docs/proposals/ft-zoxxq-mux-boundary-truth.md
      # so the abstraction theatre cannot silently re-grow after the
      # ft-zoxxq.1/.2 rename + relocation.
      - name: Mux-interface trait-object guard (ft-zoxxq.4)
        run: scripts/check_mux_interface_imports.sh

      # ft-94juo — fail CI if a sub-crate extraction introduces a cargo
      # cycle. Three such cycles were caught manually during ft-y0loj.*
      # (fleet, mcp/connector, replay tier-1); the modes-of-reasoning
      # synthesis at HEAD 2e44c882 filed this guard so the next
      # extraction attempt fails fast in the PR check rather than
      # waiting for `cargo check` after the file moves land.
      - name: Workspace dep-graph cycle guard (ft-94juo)
        run: scripts/check_workspace_cycles.sh

      # ft-93mra — fail CI if a new public primitive lands in
      # runtime_async.rs without a matching Loom skeleton. The proof
      # corpus (BR-RC-FOUNDATION.G8.2 / ft-syqcz.7) is meaningless if
      # it drifts away from the surface; this guard makes sure every
      # primitive ships with its skeleton in the same commit.
      - name: Loom skeleton coverage gate (ft-93mra)
        run: scripts/check_loom_skeleton_coverage.sh

      # ft-3kv6e — RuntimeProof adoption ratchet. Each adoption commit
      # threads &Cx (or an explicit RuntimeProof bound) through a slice
      # of pub async fn sites in frankenterm-core/src/, lowers the
      # baseline at tests/runtime_proof_coverage_baseline.json, and
      # commits both. Failure here means a new pub async fn slipped in
      # without its &Cx / RuntimeProof witness — fix the signature or
      # raise the baseline (with explicit justification in the PR).
      - name: RuntimeProof coverage ratchet (ft-3kv6e)
        run: python3 scripts/check_runtime_proof_coverage.py

      # ft-i2eni.5 — Auto-stamped README/AGENTS counts. Hand-edited
      # workspace counts in README.md / AGENTS.md drift fast (ft-d3awp
      # / ft-hdvvo). The stamper at scripts/stamp-readme-counts.sh
      # tracks each documented count via a build-time query and
      # rewrites the value into HTML-comment-delimited placeholders.
      # This step runs --check (advisory: 5% drift threshold) so a
      # PR that doesn't bump the counts after a workspace change is
      # warned but not blocked. Promote to --strict once the corpus
      # of placeholders is comprehensive.
      - name: README/AGENTS count-drift check (ft-i2eni.5, advisory)
        run: bash scripts/stamp-readme-counts.sh --check

      # ft-i2eni.6 — Vendored-fork provenance manifest drift guard.
      # Each commit that touches frankenterm/<crate>/ shifts the
      # fork-side commit count for that crate; the manifest at
      # frankenterm/PROVENANCE.json is the machine-readable source of
      # truth (per-crate name/version/fork-side-commit-count/last-
      # modified-commit/classification-summary, plus top-level
      # divergence point). This guard re-runs the generator and fails
      # if structural drift is present (ignores generated_at so the
      # check is reproducible regardless of when CI runs).
      - name: Vendored-fork provenance manifest check (ft-i2eni.6)
        run: bash scripts/check-provenance.sh

      # ft-y378j.3 — fail CI if a new file (re-)introduces a `runtime_compat`
      # reference. After ft-y378j.1/.2/.3 mass-renamed tests + production
      # source + benches to `runtime_async`, the residual references fall
      # into a tight 8-file allowlist (alias source, panic-message text,
      # audit-guard internals). The deprecated alias remains active for
      # the deprecation window (ft-y378j.4 removes it).
      - name: runtime_compat → runtime_async migration guard (ft-y378j.3)
        run: scripts/check_runtime_compat_residuals.sh

      # ft-8smkj (track A of ft-kuxho) — fail CI if CODEC_VERSION is
      # bumped in frankenterm/codec/src/lib.rs without a matching row
      # in docs/codec-versions.md. Silent protocol changes must not
      # ship; see docs/proposals/ft-kuxho-B-codec-version-min-supported-window.md
      # §3 for the policy.
      - name: Codec version release-note guard (ft-8smkj)
        run: scripts/check_codec_version_release_notes.sh

      # ft-i2eni.3 — Cargo-deny ban on direct `tokio` dependencies in
      # first-party crates. The doctrine block in AGENTS.md states
      # that the canonical async runtime is asupersync via
      # `runtime_async`; deny.toml's [bans] rule fails CI if any
      # first-party Cargo.toml regresses by adding tokio as a
      # direct dependency. Layered enforcement on top of the
      # source-level guards (wa_22x4r_no_tokio_test, dependency_eradication).
      - name: Cargo-deny tokio ban (ft-i2eni.3)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans
          arguments: --config deny.toml

  # Ship-readiness gate for the public installer shell.
  # install.sh is the curl|bash one-liner users run on a fresh machine, and
  # scripts/install-hooks.sh bootstraps the pre-commit guard on every clone.
  # A silent bash bug in either breaks users outside our dev env, where no
  # other CI job exercises them. Keep this fast (no Rust build).
  # Implements: wa-nu4.3.9.11
  installer-shell:
    name: Installer Shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Report versions
        run: |
          bash --version | head -1
          shellcheck --version | head -5

      - name: bash -n syntax check
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n scripts/install-hooks.sh

      - name: shellcheck (warning+ severity)
        run: shellcheck --severity=warning install.sh scripts/install-hooks.sh

      # ft-v5lz3.2.3 — broader gate covering all scripts/*.sh at error
      # severity (catches actual bugs without forcing a workspace-wide
      # stylistic cleanup). Operator-tooling family runs stricter below.
      # pre-commit-guard.sh is a Python file with a .sh extension (used
      # via symlink in install-hooks.sh); exclude it from the shell
      # check to avoid SC1071 noise.
      - name: shellcheck scripts/*.sh (severity=error)
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          find scripts -maxdepth 1 -name '*.sh' \! -name 'pre-commit-guard.sh' -print0 \
            | xargs -0 shellcheck --severity=error

      # Operator-tooling family is held to the warning bar — these
      # scripts coordinate the swarm and a regression here is far more
      # disruptive than in the rest of scripts/.
      - name: shellcheck operator-tooling (severity=warning)
        run: shellcheck --severity=warning scripts/swarm-tick.sh scripts/clean-stale-targets.sh

  # ft-v5lz3.2.3 — bats test suites for the operator-tooling family.
  # ft-v5lz3.2.6 made clean-stale-targets.sh portable (uname-branched
  # stat); ft-v5lz3.2.7 covers swarm-tick.sh's df/find/stat usage. Both
  # macos-14 and ubuntu-latest are exercised here so a regression on
  # either platform fails the gate.
  operator-shell-tests:
    name: Operator Shell Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq

      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats jq

      - name: Report versions
        run: |
          bats --version
          jq --version
          bash --version | head -1

      - name: Run bats suites
        env:
          BATS_VERBOSE_RUN: 1
        run: |
          set -euo pipefail
          mkdir -p target/ci-logs
          # Pipe to tee so failures still upload a log.
          bats tests/clean_stale_tests.bats 2>&1 | tee target/ci-logs/bats-clean-stale.log
          bats tests/swarm_tick_tests.bats 2>&1 | tee target/ci-logs/bats-swarm-tick.log
          if [ -f tests/operator_lock_tests.bats ]; then
            bats tests/operator_lock_tests.bats 2>&1 | tee target/ci-logs/bats-operator-lock.log
          fi

      - name: Upload bats logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operator-shell-tests-logs-${{ matrix.os }}
          path: target/ci-logs/bats-*.log
          if-no-files-found: ignore
          retention-days: 7

  # ft-ayydc — replay determinism golden matrix. The test itself builds
  # canonical replay bytes for both target triples and asserts they match;
  # this CI matrix also runs that check on the required macOS/Linux runners.
  replay-golden-matrix:
    name: Replay Golden Matrix (${{ matrix.target_triple }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target_triple: aarch64-apple-darwin
          - os: ubuntu-latest
            target_triple: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: replay-golden-matrix-${{ matrix.target_triple }}

      - name: Run replay determinism golden matrix
        env:
          FT_REPLAY_GOLDEN_MATRIX_TARGET: ${{ matrix.target_triple }}
        run: cargo test -p frankenterm-core-replay golden_matrix

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS regularly spends most of a cold run compiling/linking the workspace
    # before tests start, so the full workspace gate needs more than 30 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Run tests
        run: |
          set -eo pipefail
          mkdir -p target/ci-logs
          cargo test --workspace --verbose 2>&1 | tee target/ci-logs/test-workspace.log

      - name: Run doc tests
        run: |
          set -eo pipefail
          mkdir -p target/ci-logs
          cargo test --workspace --doc 2>&1 | tee target/ci-logs/test-doc.log

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            target/ci-logs/**/*.log
            target/**/*.stderr
            target/**/*.stdout
          if-no-files-found: ignore
          retention-days: 7

  # ft-ombfl.13 — hard-gated reference lane for GPU golden regressions.
  # Branch protection should require the stable aggregate check named
  # "GPU Regression Required", which depends on this macOS reference lane and
  # the Linux llvmpipe pilot below.
  gpu-regression-macos:
    name: GPU Regression (macOS 15 Metal)
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GPU_HARNESS_RUN_DIR: target/gpu-regression/macos-15
      GPU_HARNESS_GITHUB_ACTIONS_LOCAL_CARGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: gpu-regression-macos-15

      - name: Run GPU harness self-test
        run: |
          set -euo pipefail
          GPU_HARNESS_RUN_DIR=target/gpu-regression/macos-15-self-test \
            scripts/test-gpu-harness.sh -- --self-test --nocapture

      - name: Run macOS Metal GPU regression harness
        run: |
          set -euo pipefail
          scripts/test-gpu-harness.sh -- --nocapture

      - name: Upload macOS GPU artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-regression-macos-15
          path: |
            target/gpu-regression/macos-15/
            target/gpu-regression/macos-15-self-test/
          if-no-files-found: ignore
          retention-days: 14

  # ft-ombfl.17 — low-cost Linux software-renderer pilot for the GPU harness.
  # This lane proves llvmpipe can initialize, captures a separate Linux golden
  # namespace as an artifact, and marks macOS-vs-Linux visual drift without
  # blocking merges on cross-platform pixel differences.
  gpu-linux-llvmpipe-pilot:
    name: GPU Regression (Linux llvmpipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GPU_PILOT_FIXTURES: text-basic-paragraph,text-box-drawing,cursor-block-steady,selection-word,overlay-visual-mode
      GPU_LINUX_GOLDEN_ROOT: target/gpu-regression/linux-llvmpipe-goldens
      GPU_LINUX_VS_MACOS_ARTIFACT_DIR: target/gpu-regression/linux-vs-macos
      GPU_HARNESS_GITHUB_ACTIONS_LOCAL_CARGO: "1"
      FT_GPU_HARNESS_FORCE_SOFTWARE: "1"
      FT_GPU_HARNESS_EXPECT_SOFTWARE: "1"
      FT_GPU_HARNESS_EXPECT_ADAPTER_SUBSTRING: llvmpipe
      WGPU_BACKEND: vulkan
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      MESA_VK_DEVICE_SELECT_FORCE_DEFAULT_DEVICE: "1"
      # k9 0.12.0 -> terminal_size 0.2.6 -> rustix 0.37.28 still auto-detects
      # internal rustc_attrs on nightly for the linux_raw backend. Current
      # nightly rejects those compiler-reserved attributes, so keep this
      # Linux-only GPU pilot on rustix's stable libc backend.
      RUSTFLAGS: --cfg=rustix_use_libc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: gpu-linux-llvmpipe

      - name: Install Mesa software Vulkan stack
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-tools libgl1-mesa-dri libx11-dev libx11-xcb-dev libxcb-util-dev libxcb-image0-dev libxkbcommon-dev libxkbcommon-x11-dev libcairo2-dev pkg-config jq
          mkdir -p target/ci-logs "$GPU_LINUX_GOLDEN_ROOT" "$GPU_LINUX_VS_MACOS_ARTIFACT_DIR"
          ls -l /usr/share/vulkan/icd.d | tee target/ci-logs/gpu-linux-icd-files.log
          vulkaninfo --summary 2>&1 | tee target/ci-logs/gpu-linux-vulkaninfo.log || true

      - name: Prepare Linux golden namespace
        run: |
          set -euo pipefail
          IFS=',' read -r -a fixtures <<< "$GPU_PILOT_FIXTURES"
          for fixture in "${fixtures[@]}"; do
            mkdir -p "$GPU_LINUX_GOLDEN_ROOT/$fixture"
            cp "tests/golden/gpu/$fixture/input.json" "$GPU_LINUX_GOLDEN_ROOT/$fixture/input.json"
            cp "tests/golden/gpu/$fixture/expected.json" "$GPU_LINUX_GOLDEN_ROOT/$fixture/expected.json"
            jq '.generated_at_runner = "ubuntu-24.04-llvmpipe"' \
              "tests/golden/gpu/$fixture/meta.json" > "$GPU_LINUX_GOLDEN_ROOT/$fixture/meta.json"
          done
          find "$GPU_LINUX_GOLDEN_ROOT" -maxdepth 2 -type f | sort \
            | tee target/ci-logs/gpu-linux-namespace-files.log

      - name: Assert llvmpipe renderer determinism
        run: |
          set -euo pipefail
          GPU_HARNESS_RUN_DIR=target/gpu-regression/linux-llvmpipe-self-test \
            scripts/test-gpu-harness.sh -- --headless-render-self-test --nocapture \
            2>&1 | tee target/ci-logs/gpu-linux-llvmpipe-self-test.log

      - name: Capture Linux llvmpipe goldens
        env:
          SET_GOLDEN: "1"
          GPU_HARNESS_FIXTURE_ROOT: ${{ env.GPU_LINUX_GOLDEN_ROOT }}
          GPU_HARNESS_FIXTURE_FILTER: ${{ env.GPU_PILOT_FIXTURES }}
        run: |
          set -euo pipefail
          GPU_HARNESS_RUN_DIR=target/gpu-regression/linux-golden-capture \
            scripts/test-gpu-harness.sh -- --update-goldens --nocapture \
            2>&1 | tee target/ci-logs/gpu-linux-capture-goldens.log

      - name: Validate Linux llvmpipe namespace
        env:
          GPU_HARNESS_FIXTURE_ROOT: ${{ env.GPU_LINUX_GOLDEN_ROOT }}
          GPU_HARNESS_FIXTURE_FILTER: ${{ env.GPU_PILOT_FIXTURES }}
        run: |
          set -euo pipefail
          GPU_HARNESS_RUN_DIR=target/gpu-regression/linux-namespace-validate \
            scripts/test-gpu-harness.sh -- --nocapture \
            2>&1 | tee target/ci-logs/gpu-linux-validate-namespace.log

      - name: Compare Linux actuals with macOS goldens
        env:
          GPU_HARNESS_FIXTURE_FILTER: ${{ env.GPU_PILOT_FIXTURES }}
        run: |
          set -uo pipefail
          set +e
          GPU_HARNESS_RUN_DIR="$GPU_LINUX_VS_MACOS_ARTIFACT_DIR" \
            scripts/test-gpu-harness.sh -- --nocapture \
            2>&1 | tee target/ci-logs/gpu-linux-vs-macos.log
          status=${PIPESTATUS[0]}
          set -e
          echo "GPU_LINUX_VS_MACOS_STATUS=$status" >> "$GITHUB_ENV"
          if [ "$status" -eq 0 ]; then
            echo "Linux llvmpipe matched the checked-in macOS goldens for the pilot fixtures."
          elif [ "$status" -eq 1 ]; then
            echo "::warning title=Linux llvmpipe differs from macOS Metal goldens::Inspect target/gpu-regression/linux-vs-macos and the uploaded Linux namespace artifact."
          else
            exit "$status"
          fi

      - name: Summarize Linux GPU pilot
        if: always()
        run: |
          {
            echo "## Linux llvmpipe GPU pilot"
            echo
            echo "- Fixtures: \`$GPU_PILOT_FIXTURES\`"
            echo "- Linux golden namespace: \`$GPU_LINUX_GOLDEN_ROOT\`"
            echo "- macOS-vs-Linux comparison exit: \`${GPU_LINUX_VS_MACOS_STATUS:-not-run}\`"
            echo "- Divergence is diagnostic for this pilot; llvmpipe initialization and same-namespace repeatability are the gating checks."
            echo
            echo "Artifacts include the captured Linux goldens, macOS-vs-Linux diff reports, and Mesa adapter logs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Linux GPU pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-linux-llvmpipe-pilot
          path: |
            target/gpu-regression/linux-llvmpipe-goldens/
            target/gpu-regression/linux-llvmpipe-self-test/
            target/gpu-regression/linux-golden-capture/
            target/gpu-regression/linux-namespace-validate/
            target/gpu-regression/linux-vs-macos/
            target/ci-logs/gpu-linux-*.log
          if-no-files-found: ignore
          retention-days: 14

  gpu-regression-required:
    name: GPU Regression Required
    runs-on: ubuntu-latest
    needs:
      - gpu-regression-macos
      - gpu-linux-llvmpipe-pilot
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 5
    steps:
      - name: Check required GPU lanes
        run: |
          set -euo pipefail
          macos="${{ needs.gpu-regression-macos.result }}"
          linux="${{ needs.gpu-linux-llvmpipe-pilot.result }}"
          {
            echo "## GPU regression required status"
            echo
            echo "- macOS Metal: \`$macos\`"
            echo "- Linux llvmpipe: \`$linux\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$macos" != "success" ] || [ "$linux" != "success" ]; then
            echo "GPU regression required gate failed: macOS=$macos Linux=$linux" >&2
            exit 1
          fi

  # Feature matrix: ensure each optional feature compiles and passes tests independently.
  # Catches silent rot from features that only work when combined with --all-features.
  feature-matrix:
    name: Feature (${{ matrix.feature }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        feature:
          - default       # no features (cargo check / cargo test)
          - tui-oracle    # ratatui + crossterm parity oracle
          - ftui          # FrankenTUI (default TUI)
          - mcp           # MCP server integration
          - browser       # browser automation
          - web           # web server
          - metrics       # metrics collection
          - distributed   # distributed mode
        # vendored is tested separately since it may need extra setup
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-${{ matrix.feature }}

      - name: Log feature under test
        run: |
          echo "## Feature: \`${{ matrix.feature }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Commands:" >> $GITHUB_STEP_SUMMARY

      - name: Check compilation (no features)
        if: matrix.feature == 'default'
        run: |
          set -exo pipefail
          mkdir -p target/ci-logs
          cargo check --workspace 2>&1 | tee target/ci-logs/feature-${{ matrix.feature }}-check.log
          cargo clippy --workspace --all-targets -- -D warnings -D clippy::all 2>&1 | tee target/ci-logs/feature-${{ matrix.feature }}-clippy.log

      - name: Check compilation (feature-gated)
        if: matrix.feature != 'default'
        run: |
          set -exo pipefail
          mkdir -p target/ci-logs
          cargo check --workspace --features ${{ matrix.feature }} 2>&1 | tee target/ci-logs/feature-${{ matrix.feature }}-check.log
          cargo clippy --workspace --all-targets --features ${{ matrix.feature }} -- -D warnings -D clippy::all 2>&1 | tee target/ci-logs/feature-${{ matrix.feature }}-clippy.log

      - name: Run tests (no features)
        if: matrix.feature == 'default'
        run: cargo test --workspace --verbose

      - name: Run tests (feature-gated)
        if: matrix.feature != 'default'
        run: cargo test --workspace --features ${{ matrix.feature }} --verbose

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feature-test-logs-${{ matrix.feature }}
          path: |
            target/ci-logs/**/*.log
            target/**/*.stderr
            target/**/*.stdout
          if-no-files-found: ignore
          retention-days: 7

  # Runtime migration matrix: default workspace builds already include
  # asupersync-runtime, so exercise frankenterm-core in both runtime modes
  # explicitly to keep the tokio-compat fallback path from silently rotting.
  runtime-matrix:
    name: Runtime (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: tokio-compat
            check_args: -p frankenterm-core --all-targets --no-default-features
            test_args: -p frankenterm-core --lib --no-default-features
          - runtime: asupersync-runtime
            check_args: -p frankenterm-core --all-targets --no-default-features --features asupersync-runtime
            test_args: -p frankenterm-core --lib --no-default-features --features asupersync-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: runtime-${{ matrix.runtime }}

      - name: Log runtime under test
        run: |
          echo "## Runtime: \`${{ matrix.runtime }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Check args: \`${{ matrix.check_args }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Test args: \`${{ matrix.test_args }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Check compilation
        run: |
          set -exo pipefail
          mkdir -p target/ci-logs
          cargo check ${{ matrix.check_args }} 2>&1 | tee target/ci-logs/runtime-${{ matrix.runtime }}-check.log
          cargo clippy ${{ matrix.check_args }} -- -D warnings -D clippy::all 2>&1 | tee target/ci-logs/runtime-${{ matrix.runtime }}-clippy.log

      - name: Run focused tests
        run: cargo test ${{ matrix.test_args }} --verbose

      - name: Upload runtime logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-logs-${{ matrix.runtime }}
          path: |
            target/ci-logs/**/*.log
            target/**/*.stderr
            target/**/*.stdout
          if-no-files-found: ignore
          retention-days: 7

  # Vendored feature: separate job since it may need extra build dependencies
  feature-vendored:
    name: Feature (vendored)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-vendored

      - name: Check vendored compilation
        run: |
          set -exo pipefail
          mkdir -p target/ci-logs
          cargo check --workspace --features vendored 2>&1 | tee target/ci-logs/feature-vendored-check.log
          cargo clippy --workspace --all-targets --features vendored -- -D warnings -D clippy::all 2>&1 | tee target/ci-logs/feature-vendored-clippy.log

      - name: Run vendored tests
        run: cargo test --workspace --features vendored --verbose

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feature-test-logs-vendored
          path: |
            target/ci-logs/**/*.log
            target/**/*.stderr
            target/**/*.stdout
          if-no-files-found: ignore
          retention-days: 7

  # ft-bzgxi - citable multi-feature compile combinations. The older
  # feature-matrix job proves individual feature lanes; this one proves the
  # combinations documented in docs/feature-flag-matrix.md before anyone cites
  # them as supported.
  feature-combination-matrix:
    name: Feature Combination Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-combination-matrix

      - name: Check known-good feature combinations
        run: bash scripts/check_feature_flag_matrix.sh

  # FTUI migration guardrails: verify feature exclusion, import isolation,
  # and clippy compliance for both TUI backends.
  # Implements: wa-eutd (FTUI-02.4)
  ftui-guardrails:
    name: FTUI Guardrails
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ftui-guardrails

      - name: Run FTUI guardrail checks
        run: scripts/check_ftui_guardrails.sh

  # FTUI migration test suite: grouped snapshot, E2E, and unit test execution
  # with minimum count enforcement and diagnostic artifact collection.
  # Implements: wa-36xw (FTUI-07.4)
  ftui-tests:
    name: FTUI Tests
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: ftui-tests

      - name: Run FTUI test suite
        run: scripts/check_ftui_tests.sh

      - name: Upload FTUI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftui-test-artifacts
          path: |
            target/ftui-test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # FTUI docs-smoke and contract-drift: validate migration docs stay in sync
  # with code (View enum, adapter API, feature matrix, parity contract).
  # Implements: wa-107q (FTUI-07.5)
  ftui-docs:
    name: FTUI Docs Smoke
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: ftui-docs

      - name: Run docs-smoke and contract-drift checks
        run: scripts/check_ftui_docs.sh

  # Performance budget enforcement: run Criterion benchmarks and check against
  # coarse thresholds (10x design budgets) to catch gross regressions.
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmarks

      - name: Run benchmarks and check budgets
        run: scripts/check_bench_budgets.sh

      # ft-9zzkg — Bench-stats per-PR gate (advisory mode). Reads the
      # Distribution rows that bench_common::emit_bench_distributions
      # appends to wa-bench-distributions.jsonl after each Criterion
      # run, fetches the baseline from origin/main, and prints a
      # verdict per (group, bench_id). Stays advisory until a real
      # baseline lands on main; graduation to enforce mode is tracked
      # under the same bead.
      - name: Bench-stats verdict (ft-9zzkg, advisory)
        env:
          BENCH_STATS_MODE: advisory
        run: scripts/check_bench_stats.sh

      - name: Run replay performance gates
        run: scripts/check_replay_performance_gates.sh

      - name: Refresh replay performance baseline candidate on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          scripts/check_replay_performance_gates.sh \
            --check \
            --write-baseline \
            --baseline-source ci_main_merge \
            --criterion-dir target-replay-performance-gates/criterion \
            --artifacts-dir target/replay-performance-gates \
            --baseline-file target/replay-performance-gates/replay_performance_baseline.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            target/criterion/ft-budget-report.json
            target/criterion/ft-bench-meta.jsonl
            target/criterion/ft-bench-manifest-*.json
            target/criterion/bench-output.log
            target/criterion/wa-bench-distributions.jsonl
            target/criterion/wa-bench-stats-verdict.json
            target/replay-performance-gates/replay-performance-report.json
            target/replay-performance-gates/replay_performance_baseline.json
            target/replay-performance-gates/replay-performance-bench.log
          if-no-files-found: ignore
          retention-days: 14

  # Resize/reflow SLO gates: deterministic scenario + timeline threshold checks
  # for M1/M2/M3 mid-tier budgets with machine-readable reports.
  # Implements: ft-1u90p.7.4
  resize-performance-gates:
    name: Resize Performance Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: resize-performance-gates

      - name: Run resize performance regression gates
        run: scripts/check_resize_performance_gates.sh

      - name: Upload resize gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-performance-gates
          path: |
            target/resize-performance-gates/
          if-no-files-found: ignore
          retention-days: 14

  # FrankenSqlite migration quality gates: T1-T6 tiered test coverage
  # with BT1-BT5 wave readiness assessment. T6 is advisory.
  # Implements: ft-2vuw7.1.4.1.4.2.3
  frankensqlite-gates:
    name: FrankenSqlite Gates
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: frankensqlite-gates

      - name: Run FrankenSqlite CI quality gates
        run: scripts/ci_frankensqlite_gates.sh

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frankensqlite-gate-report
          path: |
            test_results/ci_frankensqlite_gates_*.log
            test_results/frankensqlite_gate_report_*.json
          if-no-files-found: ignore
          retention-days: 14

  # Recorder validation gates: wire load/invariant/quality/recovery harnesses
  # into CI with explicit thresholds and artifact retention.
  # Implements: wa-oegrb.7.5
  recorder-validation-gates:
    name: Recorder Validation Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: recorder-validation-gates

      - name: Run recorder validation gates (CI mode)
        run: scripts/check_recorder_validation_gates.sh

      - name: Upload recorder validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-validation-gates
          path: |
            target/recorder-validation-gates/
          if-no-files-found: ignore
          retention-days: 14

  # Security audit for dependency vulnerabilities
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit

  # Coverage with llvm-cov
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      - name: Generate coverage
        run: |
          cargo llvm-cov --workspace \
            --ignore-filename-regex "(tests/|benches/)" \
            --codecov \
            --output-path codecov.json

      - uses: codecov/codecov-action@v4
        with:
          files: codecov.json
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage threshold
        run: |
          cargo llvm-cov --workspace --json --output-path cov.json
          COVERAGE=$(jq -r '.data[0].totals.lines.percent // 0' cov.json)
          echo "## Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          # Threshold set to 50% for early development, increase as coverage improves
          if (( $(echo "$COVERAGE < 50" | bc -l) )); then
            echo "::warning::Coverage $COVERAGE% is below 50%"
          fi

  # Extended E2E: approval allow-once scenario + artifact collection.
  # Runs the approval flow E2E (unit-based, no live WezTerm required) and the
  # prepare_commit_approvals harness scenario when prerequisites are available.
  # Implements: wa-nu4.3.9.7
  e2e-extended:
    name: E2E (approval allow-once)
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-extended

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -qq -y jq

      - name: Build ft (release)
        run: cargo build --release -p frankenterm

      - name: E2E harness self-check
        run: scripts/e2e_test.sh --self-check --skip-self-check 2>&1 || true

      - name: Run approval flow E2E
        id: approval_e2e
        run: |
          scripts/e2e_approval_flow.sh 2>&1 | tee e2e-approval-output.log
        env:
          FT_LOG_LEVEL: debug
          FT_LOG_FORMAT: json
          FT_E2E_VERBOSE: "1"
          FT_E2E_KEEP_ARTIFACTS: "1"

      - name: Ensure visual artifact summaries are generated
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d e2e-artifacts ]]; then
            echo "No e2e-artifacts directory present; skipping visual summary generation"
            exit 0
          fi
          found=0
          while IFS= read -r run_dir; do
            [[ -d "$run_dir/scenarios" ]] || continue
            found=1
            echo "Running visual artifact detector for: $run_dir"
            scripts/check_visual_artifact_detector.sh --run-dir "$run_dir" || true
          done < <(find e2e-artifacts -mindepth 1 -maxdepth 1 -type d | LC_ALL=C sort)
          if [[ "$found" -eq 0 ]]; then
            echo "No e2e run directories with scenarios found"
          fi

      - name: Summarize approval E2E results
        if: always()
        run: |
          echo "## E2E: Approval Allow-Once" >> $GITHUB_STEP_SUMMARY
          if [[ -f e2e-approval-output.log ]]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -10 e2e-approval-output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Visual Artifact Detector" >> $GITHUB_STEP_SUMMARY
          summaries_found=0
          while IFS= read -r summary_file; do
            summaries_found=1
            run_dir=$(dirname "$summary_file")
            run_name=$(basename "$run_dir")
            status=$(jq -r '.status // "unknown"' "$summary_file")
            alerts=$(jq -r '.counts.alerts // 0' "$summary_file")
            fp_rate=$(jq -r '.quality.false_positive_estimate.rate // 0' "$summary_file")
            trend_samples=$(jq -r '.trend.sample_count // 0' "$summary_file")
            echo "- \`$run_name\`: status=\`$status\`, alerts=$alerts, fp_rate=$fp_rate, trend_samples=$trend_samples" >> $GITHUB_STEP_SUMMARY
          done < <(find e2e-artifacts -type f -name 'visual_artifact_summary.json' | LC_ALL=C sort)
          if [[ "$summaries_found" -eq 0 ]]; then
            echo "- no visual artifact summaries generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-approval-artifacts
          path: |
            e2e-artifacts/
            e2e-approval-output.log
          if-no-files-found: ignore
          retention-days: 7

  # Docker-dependent E2E coverage policy:
  # - Ubuntu runs the real Docker-backed setup_remote_docker scenario.
  # - GitHub-hosted macOS does not provide Docker Desktop / a Docker daemon, so
  #   macOS runs the mocked helper E2E plus an explicit waiver artifact instead.
  #   See docs/ci-docker-e2e-policy.md.
  # Implements: wa-nu4.3.9.28
  docker-e2e:
    name: Docker E2E (${{ matrix.os }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: linux-real-docker
            artifact: docker-e2e-linux
          - os: macos-14
            mode: macos-documented-waiver
            artifact: docker-e2e-macos-waiver
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        if: matrix.mode == 'linux-real-docker'

      - uses: Swatinem/rust-cache@v2
        if: matrix.mode == 'linux-real-docker'
        with:
          key: docker-e2e-${{ matrix.os }}

      - name: Install Linux E2E prerequisites
        if: matrix.mode == 'linux-real-docker'
        run: sudo apt-get update -qq && sudo apt-get install -qq -y jq openssh-client

      - name: Build ft for Docker E2E
        if: matrix.mode == 'linux-real-docker'
        run: cargo build --release -p frankenterm

      - name: Run real Docker setup-remote E2E (Linux)
        if: matrix.mode == 'linux-real-docker'
        env:
          FT_E2E_ENABLE_SETUP_REMOTE: "1"
          FT_E2E_KEEP_ARTIFACTS: "1"
          FT_E2E_VERBOSE: "1"
        run: |
          set -euo pipefail
          scripts/e2e_test.sh --skip-self-check --keep-artifacts --timeout 180 setup_remote_docker 2>&1 | tee docker-e2e-linux.log

      - name: Run mocked setup-remote helper E2E (macOS)
        if: matrix.mode == 'macos-documented-waiver'
        run: |
          set -euo pipefail
          mkdir -p target/docker-e2e-policy
          bash tests/e2e/test_ft_nu4_3_3_11.sh 2>&1 | tee target/docker-e2e-policy/setup-remote-mock-macos.log

      - name: Record macOS Docker waiver
        if: matrix.mode == 'macos-documented-waiver'
        run: |
          set -euo pipefail
          mkdir -p target/docker-e2e-policy
          {
            echo "# macOS Docker E2E Waiver"
            echo
            echo "Policy: GitHub-hosted macOS runners do not run the real Docker-dependent setup_remote_docker scenario."
            echo "Reason: Docker Desktop / Docker daemon is not part of the hosted macOS runner image; attempting to install it would introduce an unsupported nested-VM/Desktop dependency."
            echo "Replacement signal: tests/e2e/test_ft_nu4_3_3_11.sh validates the setup-remote Docker helper through mocked docker/ssh/ft commands on macOS, while cargo-install-validation.yml covers the macOS install path."
            echo
            echo "docker availability probe:"
            if command -v docker >/dev/null 2>&1; then
              docker --version || true
              docker info || true
            else
              echo "docker command not found"
            fi
          } > target/docker-e2e-policy/macos-waiver.md

      - name: Upload Docker E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            e2e-artifacts/
            tests/e2e/logs/
            tests/e2e/artifacts/ft_nu4_3_3_11_setup_remote_docker/
            docker-e2e-linux.log
            target/docker-e2e-policy/
          if-no-files-found: ignore
          retention-days: 7

  # Build verification across platforms
  build:
    name: Build (${{ matrix.target }})
    needs: [lint, test, feature-matrix, runtime-matrix, ftui-tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ft-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/ft
            target/${{ matrix.target }}/release/ft.exe
          if-no-files-found: ignore

  # Assert that the shipped release binary's `ft --version` and
  # `ft version --full` outputs match the shape the README Quickstart (and
  # release.yml smoke step) depend on. Protects against silent drift from
  # build.rs, main.rs build_meta, or the clap version wiring.
  # Implements: wa-nu4.3.9.18
  version-smoke:
    name: Version Smoke (${{ matrix.label }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ft-x86_64-unknown-linux-gnu
            label: linux-amd64
          - os: macos-14
            artifact: ft-aarch64-apple-darwin
            label: darwin-arm64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dl

      - name: Locate ft binary
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          # upload-artifact@v4 preserves path structure, so the binary may land at
          # dl/ft or dl/target/<triple>/release/ft depending on how the producer
          # configured the path. Find it either way.
          binary="$(find dl -type f -name ft | head -n 1)"
          if [[ -z "$binary" ]]; then
            echo "::error::ft binary not found in downloaded artifact"
            find dl -maxdepth 5 -type f
            exit 1
          fi
          chmod +x "$binary"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
          echo "Located: $binary"

      - name: Assert `ft --version` output shape
        shell: bash
        env:
          FT_BIN: ${{ steps.locate.outputs.binary }}
        run: |
          set -euo pipefail
          out="$("$FT_BIN" --version)"
          printf 'ft --version:\n%s\n' "$out"
          # Short form must contain semver.
          printf '%s' "$out" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::ft --version output missing semver pattern"; exit 1; }
          # Short form must contain a commit hash (or 'unknown') in parens.
          printf '%s' "$out" | grep -qE '\(([0-9a-f]{7,40}|unknown)[^)]*\)' \
            || { echo "::error::ft --version output missing commit-in-parens"; exit 1; }

      - name: Assert `ft version --full` output shape
        shell: bash
        env:
          FT_BIN: ${{ steps.locate.outputs.binary }}
        run: |
          set -euo pipefail
          out="$("$FT_BIN" version --full)"
          printf 'ft version --full:\n%s\n' "$out"
          # Version header 'ft X.Y.Z...'
          printf '%s\n' "$out" | grep -qE '^ft [0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::verbose version missing 'ft X.Y.Z' header"; exit 1; }
          # commit: <hex7-40> | unknown (+ optional +dirty)
          printf '%s\n' "$out" | grep -qE '^commit: +([0-9a-f]{7,40}|unknown)' \
            || { echo "::error::verbose version missing commit field"; exit 1; }
          # built: ISO8601 Z | epoch:<n> | unknown
          printf '%s\n' "$out" | grep -qE '^built: +([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z|epoch:[0-9]+|unknown)' \
            || { echo "::error::verbose version missing built field"; exit 1; }
          for field in rustc target features; do
            printf '%s\n' "$out" | grep -qE "^${field}:" \
              || { echo "::error::verbose version missing ${field} field"; exit 1; }
          done
