# Renderer Fuzz Lane
#
# [BR-TERM-EMULATOR-UPLIFT.1.6.cont] / ft-n0hpo
#
# Nightly 24h adversarial fuzz against the headless software
# renderer. The harness binary at
# `crates/frankenterm-gui/tests/gpu_regression.rs` accepts
# `--fuzz-seed=<u64>` / `--fuzz-duration=<secs>` /
# `--fuzz-start-at=<event_idx>` / `--runs-dir=<path>` and emits
# the runs/<run_id>/ artifact tree contracted in
# `crates/frankenterm-core/src/gpu_regression_fuzz_report.rs`.
#
# This job intentionally uses the standard GitHub-hosted
# `ubuntu-24.04` runner plus Mesa llvmpipe setup below. Do not move
# it back to an unprovisioned custom GPU label; queue-only jobs are
# not renderer proof. The preflight step fails clearly until the
# harness fuzz CLI wiring lands.
#
# Acceptance (RQ-S4 in docs/perf/resize-quality-slo.md):
# 0 critical artifacts over 24h. Minor artifacts are budgeted
# at 0.1% of resize-class events.
#
# Critical classes (per fuzz/README.md):
#   - blank frame
#   - stale full-frame (≥ 200 events earlier, byte-identical)
#   - tear band (pristine area with ΔL∞ ≥ 32)

name: Renderer Fuzz

on:
  schedule:
    # Daily at 03:00 UTC — outside business hours for both
    # NA and EU contributors.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      duration_secs:
        description: "Per-seed duration in seconds (default 10800 = 3h × 8 seeds = 24h)"
        type: number
        default: 10800
      seed_override:
        description: "Optional single seed label or 0x-prefixed seed for triage runs"
        type: string

permissions:
  contents: read

env:
  # The 8 fixed seeds the bead enumerates. The 9th run uses a
  # random seed (date-derived for reproducibility).
  FIXED_SEEDS: "0xa5a5a5a5 0xdeadbeef 0xcafebabe 0xfeedface 0x12345678 0x87654321 0x0badc0de 0xf00dface"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: 24h adversarial fuzz (Linux llvmpipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 1500 # 25h, gives 1h buffer over 24h budget
    env:
      GPU_HARNESS_GITHUB_ACTIONS_LOCAL_CARGO: "1"
      FT_GPU_HARNESS_FORCE_SOFTWARE: "1"
      FT_GPU_HARNESS_EXPECT_SOFTWARE: "1"
      FT_GPU_HARNESS_EXPECT_ADAPTER_SUBSTRING: llvmpipe
      WGPU_BACKEND: vulkan
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      MESA_VK_DEVICE_SELECT_FORCE_DEFAULT_DEVICE: "1"
    strategy:
      fail-fast: false
      matrix:
        # 8 fixed seeds + 1 date-derived random.
        seed_label: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.seed_override != '') && format('[{0}]', toJSON(inputs.seed_override)) || '["a5a5a5a5","deadbeef","cafebabe","feedface","12345678","87654321","0badc0de","f00dface","random"]') }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: renderer-fuzz

      - name: Validate fuzz harness wiring
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          harness = Path("crates/frankenterm-gui/tests/gpu_regression.rs")
          source = harness.read_text()
          required = ("--fuzz-seed", "--fuzz-duration", "--fuzz-start-at", "--runs-dir")
          missing = [flag for flag in required if flag not in source]
          if missing:
              print(
                  "::error title=Renderer fuzz harness not wired::"
                  "The scheduled renderer fuzz lane is on a standard ubuntu-24.04 llvmpipe runner now, "
                  "but gpu_regression.rs still lacks parser support for "
                  + ", ".join(missing)
                  + ". Land the harness fuzz CLI integration before treating this workflow as RQ-S4 proof."
              )
              sys.exit(1)
          PY

      - name: Install Mesa software Vulkan stack
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-tools libgl1-mesa-dri libx11-dev libx11-xcb-dev libxcb-util-dev libxcb-image0-dev libxkbcommon-dev libxkbcommon-x11-dev libcairo2-dev pkg-config jq
          mkdir -p target/ci-logs
          ls -l /usr/share/vulkan/icd.d | tee target/ci-logs/renderer-fuzz-icd-files.log
          vulkaninfo --summary 2>&1 | tee target/ci-logs/renderer-fuzz-vulkaninfo.log || true

      - name: Resolve seed
        id: seed
        shell: bash
        run: |
          seed_label="${{ matrix.seed_label }}"
          if [ "$seed_label" = "random" ]; then
            # Date-derived random seed for reproducibility.
            seed=$(printf "0x%016x" $(($(date -u +%s) ^ 0xc0ffeebabe)))
          elif [[ "$seed_label" == 0x* ]]; then
            seed="$seed_label"
          else
            seed="0x${seed_label}"
          fi
          echo "value=${seed}" >> "$GITHUB_OUTPUT"

      - name: Build harness
        run: |
          cargo build \
              --release \
              -p frankenterm-gui \
              --test gpu_regression \
              --features headless-render

      - name: Run fuzz lane
        id: fuzz
        run: |
          DURATION="${{ inputs.duration_secs || 10800 }}"
          mkdir -p runs
          set +e
          cargo test \
              --release \
              -p frankenterm-gui \
              --test gpu_regression \
              --features headless-render \
              -- \
              --nocapture \
              --fuzz-seed=${{ steps.seed.outputs.value }} \
              --fuzz-duration=${DURATION} \
              --runs-dir=$PWD/runs
          status=$?
          set -e
          echo "exit_status=${status}" >> "$GITHUB_OUTPUT"

      - name: Aggregate violations
        if: always()
        run: |
          # Aggregate violations.jsonl across runs/<run_id>/
          # and tally critical vs minor.
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import glob, json, os, sys

          critical = 0
          minor = 0
          per_kind = {}
          for path in glob.glob("runs/*/violations.jsonl"):
              with open(path) as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      rec = json.loads(line)
                      slug = rec["kind"]["kind"]
                      per_kind[slug] = per_kind.get(slug, 0) + 1
                      if slug in {"blank_frame", "stale_full_frame", "tear_band"}:
                          critical += 1
                      else:
                          minor += 1

          print(f"## Renderer fuzz seed `${{ steps.seed.outputs.value }}`")
          print()
          print(f"- Critical violations: **{critical}**")
          print(f"- Minor violations: **{minor}**")
          print()
          print("| Kind | Count |")
          print("|---|---:|")
          for slug, n in sorted(per_kind.items()):
              print(f"| {slug} | {n} |")
          PY

      - name: Upload runs/ tree
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: renderer-fuzz-${{ matrix.seed_label }}
          path: runs/
          retention-days: 30

      - name: Fail on any critical violation
        if: always()
        run: |
          # RQ-S4: zero critical artifacts over 24h.
          critical=$(find runs -name violations.jsonl -exec cat {} + \
              | python3 -c '
          import json, sys
          n = 0
          for line in sys.stdin:
              line = line.strip()
              if not line: continue
              rec = json.loads(line)
              if rec["kind"]["kind"] in {"blank_frame", "stale_full_frame", "tear_band"}:
                  n += 1
          print(n)
          ')
          if [ "${critical}" != "0" ]; then
              echo "::error::RQ-S4 violated: ${critical} critical artifacts on seed ${{ steps.seed.outputs.value }}"
              exit 1
          fi

  summary:
    name: 24h fuzz summary
    needs: fuzz
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: runs-aggregate
      - name: Post next-day summary
        run: |
          # Aggregate violations across all 9 seeds for the
          # next-day commit-status check. The harness binary
          # is the source of truth for the JSONL format; this
          # step is purely report-shaping.
          echo "## Renderer fuzz aggregated summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          total_critical=0
          for d in runs-aggregate/*/; do
              if [ -d "${d}runs" ]; then
                  found=$(find "${d}runs" -name violations.jsonl 2>/dev/null \
                      | xargs cat 2>/dev/null \
                      | python3 -c '
          import json, sys
          n = 0
          for line in sys.stdin:
              line = line.strip()
              if not line: continue
              rec = json.loads(line)
              if rec["kind"]["kind"] in {"blank_frame", "stale_full_frame", "tear_band"}:
                  n += 1
          print(n)
          ' 2>/dev/null || echo 0)
                  total_critical=$((total_critical + found))
                  echo "- ${d}: ${found} critical" >> $GITHUB_STEP_SUMMARY
              fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total critical across 9 seeds: ${total_critical}**" >> $GITHUB_STEP_SUMMARY
          if [ "${total_critical}" != "0" ]; then
              echo "::error::24h fuzz produced ${total_critical} critical violations — RQ-S4 floor breached"
              exit 1
          fi
