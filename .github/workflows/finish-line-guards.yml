name: Finish-Line Guards

# Permanent regression guards for the ft-xbnl0 finish-line program (bead
# ft-xbnl0.5.2). Runs on every PR + push to main so the no-tokio/smol/
# async-io invariant, the forbidden-token ceiling invariant, the SDK
# capability contract, the supported-path stub-marker inventory, and the
# artifact-contract shape never silently regress.
#
# Each guard is actionable: failure output names the exact guard,
# reason_code, and log tail. Contributors can reproduce the full sweep
# locally with:
#     bash scripts/check_finish_line_guards.sh
#
# The composition manifest is docs/ft-xbnl0-5-2-finish-line-guards.json.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: finish-line-guards-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RCH_GITHUB_ACTIONS_LOCAL_CARGO: "1"

jobs:
  shell-guards:
    name: Shell guards (no cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install jq + python3
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3

      - name: Run ft-xbnl0.5.2 composition (skip cargo test guard)
        env:
          # cargo test runs in the cargo-guards job below, not here,
          # so the composition's SDK-capability guard is explicitly skipped
          # to keep this job fast and cargo-free.
          FT_XBNL0_5_2_SKIP_CARGO_TEST: "1"
        run: bash scripts/check_finish_line_guards.sh --output "$RUNNER_TEMP/finish-line-guards.json"

      # br-ft-gsgll / BR-RC-RUNTIME-SEMANTICS.G14.2.cont.ci:
      # Wire cx-propagation-burndown.py --check into PR CI as the
      # regression guard. The script exits 1 when uncovered_sites > 0
      # (any pub async fn that doesn't thread Cx through the chain),
      # so this step fails the lane on a regression. Step is
      # cargo-free + python3 already installed above; runs in seconds.
      - name: Run cx-propagation burndown gate (br-ft-gsgll)
        run: python3 scripts/cx_propagation_burndown.py --check

      - name: Upload guard summary
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: finish-line-guards-summary-shell
          path: |
            ${{ runner.temp }}/finish-line-guards.json
            docs/ft-xbnl0-3-6-supported-path-stub-markers-validation.json
            docs/ft-xbnl0-2-6-no-runtime-regression-validation.json
            docs/asupersync-cutover-runtime-guard-validation.json
          if-no-files-found: warn
          retention-days: 30

  cargo-guards:
    name: Cargo test guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: finish-line-guards-cargo

      - name: Run ft-xbnl0.3.6 SDK capability contract test
        run: |
          cargo test -p frankenterm-core --lib \
            robot_sdk_contracts::tests::ft_xbnl0_3_6_python_rust_and_typescript_sdk_targets_are_finish_line_supported \
            -- --exact --nocapture

      - name: Run ft-xbnl0.2.6 no-runtime regression gate (Rust wrapper)
        run: |
          cargo test -p frankenterm-core --test ft_xbnl0_2_6_no_runtime_regression_gate \
            --no-default-features \
            -- --nocapture

      - name: Run ft-xbnl0.5.2 finish-line guard composition test
        run: |
          cargo test -p frankenterm-core --test ft_xbnl0_5_2_finish_line_guards \
            --no-default-features \
            -- --nocapture

      - name: Run ft-e87u6.4 README/AGENTS hedge alignment E2E
        run: bash tests/e2e/test_ft_e87u6_4_hedge_alignment.sh

      - name: Run ft-e87u6.5 attestation manifest completeness E2E
        run: bash tests/e2e/test_ft_e87u6_5_manifest_completeness.sh

      - name: Run ft-e87u6.6 attestation closing-template E2E
        run: bash tests/e2e/test_ft_e87u6_6_template_smoke.sh

      - name: Run ft-e87u6.7 README attestation cross-link E2E
        run: bash tests/e2e/test_ft_e87u6_7_readme_cross_links.sh

      # ft-s2034 / BR-RC-RUNTIME-SEMANTICS.G14.1.cont.ci:
      # Rust-side syn-AST cx-propagation analyzer (ft-t9a6q.1) as
      # a hard PR-CI gate.
      #
      # Cadence per the parent epic: land as warning, escalate to
      # error after burn-down (ft-t9a6q.2) completes. Both halves
      # landed under this bead:
      #   1. Warning-mode wiring shipped at commit 2fdc207a1
      #      (continue-on-error: true).
      #   2. Escalation to error mode shipped here once
      #      ft-t9a6q.2 closed with totals.uncovered_sites=0
      #      (verified by `python3 scripts/cx_propagation_burndown.py
      #      --check` and the post-pin allowlist sync).
      #
      # The Python audit at the shell-guards `Run cx-propagation
      # burndown gate (br-ft-gsgll)` step enforces the same
      # invariant via regex heuristics; this Rust path adds AST
      # precision and catches divergence between the two surfaces.
      # If the Python lockstep guard ever lands a one-sided
      # exemption, this step is what surfaces it pre-merge.
      - name: Run cx-propagation lint (br-ft-s2034)
        run: |
          cargo run -q --release -p cx_propagation_lint -- crates/frankenterm-core/src

      - name: Upload ft-e87u6.4 hedge alignment artifact bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ft-e87u6-4-hedge-alignment
          path: tests/e2e/artifacts/goal-line/ft-e87u6/hedge-alignment/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ft-e87u6.5 manifest completeness artifact bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ft-e87u6-5-manifest-completeness
          path: tests/e2e/artifacts/goal-line/ft-e87u6/manifest_completeness/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ft-e87u6.6 attestation closing-template artifact bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ft-e87u6-6-template-smoke
          path: tests/e2e/artifacts/goal-line/ft-e87u6/template_smoke/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ft-e87u6.7 README attestation cross-link artifact bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ft-e87u6-7-readme-cross-links
          path: tests/e2e/artifacts/goal-line/ft-e87u6/readme-cross-links/
          if-no-files-found: warn
          retention-days: 30

  e2e-composition:
    name: E2E composition scenario
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install jq + python3
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3

      - name: Run ft-xbnl0.5.2 composition E2E
        env:
          FT_XBNL0_5_2_SKIP_CARGO_TEST: "1"
        run: bash tests/e2e/test_ft_xbnl0_5_2_finish_line_guards.sh

      - name: Run ft-5eqd4.4 policy count doc-pin E2E
        run: bash tests/e2e/test_ft_5eqd4_4_policy_count_doc_pin.sh

      - name: Assert ft-5eqd4.4 policy count E2E emitted no failed rows
        if: always()
        run: |
          shopt -s nullglob
          logs=(tests/e2e/artifacts/goal-line/ft-5eqd4/policy_count_doc_pin/*/structured.log)
          if [[ ${#logs[@]} -eq 0 ]]; then
            echo "No ft-5eqd4.4 structured.log files found" >&2
            exit 1
          fi
          if jq -e 'select(.outcome == "failed")' "${logs[@]}" >/dev/null; then
            echo "ft-5eqd4.4 policy count harness emitted failed rows" >&2
            exit 1
          fi

      - name: Run ft-5eqd4.5 policy count epic convergence E2E
        run: bash tests/e2e/test_ft_5eqd4_5_epic_convergence.sh

      - name: Assert ft-5eqd4.5 policy convergence emitted no failed rows
        if: always()
        run: |
          shopt -s nullglob
          logs=(tests/e2e/artifacts/goal-line/ft-5eqd4/convergence/*/structured.log)
          if [[ ${#logs[@]} -eq 0 ]]; then
            echo "No ft-5eqd4.5 structured.log files found" >&2
            exit 1
          fi
          if jq -e 'select(.outcome == "failed")' "${logs[@]}" >/dev/null; then
            echo "ft-5eqd4.5 policy convergence harness emitted failed rows" >&2
            exit 1
          fi

      - name: Run ft-e87u6.2 attestation build matrix
        env:
          FT_E87U6_2_ARTIFACT_DIR: ${{ runner.temp }}/ft-e87u6-2-attestation-build-matrix
        run: bash tests/scripts/test_attestation_build_matrix.sh

      - name: Upload E2E artifact bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: finish-line-guards-e2e-bundle
          path: tests/e2e/logs/ft_xbnl0_5_2_finish_line_guards_*/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ft-5eqd4.4 policy count artifact bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ft-5eqd4-4-policy-count-doc-pin
          path: tests/e2e/artifacts/goal-line/ft-5eqd4/policy_count_doc_pin/
          if-no-files-found: error
          retention-days: 30

      - name: Upload ft-5eqd4.5 policy convergence artifact bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ft-5eqd4-5-policy-convergence
          path: tests/e2e/artifacts/goal-line/ft-5eqd4/convergence/
          if-no-files-found: error
          retention-days: 30

      - name: Upload ft-e87u6.2 attestation build matrix
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ft-e87u6-2-attestation-build-matrix
          path: ${{ runner.temp }}/ft-e87u6-2-attestation-build-matrix/
          if-no-files-found: error
          retention-days: 30

  ft-e87u6-convergence:
    name: ft-e87u6.8 attestation convergence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - shell-guards
      - cargo-guards
      - e2e-composition
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: finish-line-guards-attestation-convergence

      - name: Install jq + python3
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3

      - name: Run ft-e87u6.8 epic convergence E2E
        run: bash tests/e2e/test_ft_e87u6_8_epic_convergence.sh

      - name: Upload ft-e87u6.8 convergence artifact bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ft-e87u6-8-epic-convergence
          path: tests/e2e/artifacts/goal-line/ft-e87u6/convergence/
          if-no-files-found: error
          retention-days: 30
