version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      # Group minor/patch updates together
      rust-deps:
        patterns: ["*"]
        exclude-patterns:
          - "tokio*"
          - "serde*"
          - "rusqlite*"
      # Core async runtime - review separately
      tokio:
        patterns: ["tokio*"]
      # Serialization - review separately
      serde:
        patterns: ["serde*"]
      # Database - review separately (bundled SQLite)
      database:
        patterns: ["rusqlite*"]
    commit-message:
      prefix: "deps"
    ignore:
      # Ignore major version updates for core deps (manual review)
      - dependency-name: "tokio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rusqlite"
        update-types: ["version-update:semver-major"]
      # 0.21 redesigned the dispatch API that frankenterm/window/src/os/wayland uses;
      # porting is a manual job (Linux-only build break, not caught on macOS).
      - dependency-name: "smithay-client-toolkit"
        versions: [">=0.21"]
      # frankenterm-char-props pins phf exactly: emoji_variation.rs embeds hash
      # state generated for that release line, and a bump without regenerating
      # it makes every VS15/VS16 lookup miss (e73b0d7e4, 70b0ee5ec). Upgrade by
      # hand together with the codegen crate and a regenerated table.
      - dependency-name: "phf"
      - dependency-name: "phf_shared"
      - dependency-name: "phf_codegen"
      # zstd 0.14.4 writes the frame content size from encode_all but not from
      # the stream encoder the codec's bounded outbound path uses, so the codec's
      # byte-identity tests fail. Unpinning needs a codec decision on wire bytes.
      - dependency-name: "zstd"
        versions: [">=0.14.4"]
      # zbus 6 drops zvariant for its own type system: the zvariant derives behind
      # toast-notification's #[proxy] no longer satisfy it (window's xdg portal
      # proxy uses zvariant too). Linux-only build break; port by hand.
      - dependency-name: "zbus"
        versions: [">=6"]
