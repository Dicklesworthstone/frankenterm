# ft-x0666.1: passive-watch read-only fuzz proof. Drives the
# scan_pipeline (ft watch's input parser) with adversarial pane-
# output bytes and asserts the bead's headline rule: zero
# outbound mutating IPC, zero non-capture storage writes per
# input. The contract module + adversarial-corpus catalog +
# observation/health types live in
# crates/frankenterm-core/src/passive_watch_invariant.rs.
[[bin]]
name = "passive_watch_invariant"
path = "fuzz_targets/passive_watch_invariant.rs"
doc = false
required-features = ["core-fuzz-targets"]



# ft-ul4vi: fuzz the jsonschema validator + compiler (the crate
# ft-5ikbd, ft-2sumi, ft-b35tw, and ft-zaqi8 all rely on at the
# conformance-gate boundary).
[[bin]]
name = "jsonschema_validator"
path = "fuzz_targets/jsonschema_validator.rs"
doc = false

# ft-s96ej: fuzz the `ft` CLI argv parsing surface. Mirrors the
# production Cli's top-level shape via clap's builder API so the
# harness doesn't depend on the binary crate's private Cli enum.
[[bin]]
name = "ft_argv"
path = "fuzz_targets/ft_argv.rs"
doc = false

[[bin]]
name = "escape_parser_raw"
path = "fuzz_targets/escape_parser_raw.rs"
doc = false

[[bin]]
name = "termwiz_input_parser"
path = "fuzz_targets/termwiz_input_parser.rs"
doc = false

[[bin]]
name = "replay_recording_from_bytes"
path = "fuzz_targets/replay_recording_from_bytes.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "ftvi_index_from_bytes"
path = "fuzz_targets/ftvi_index_from_bytes.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "term_advance_bytes"
path = "fuzz_targets/term_advance_bytes.rs"
doc = false

[[bin]]
name = "mcp_request_params"
path = "fuzz_targets/mcp_request_params.rs"
doc = false
required-features = ["mcp-fuzz-targets"]

[profile.release]
debug = 1
