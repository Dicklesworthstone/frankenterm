[package]
name = "frankenterm-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
default = [
    "core-fuzz-targets",
    "mcp-fuzz-targets",
    "mux-server-fuzz-targets",
    "scripting-fuzz-targets",
]
core-fuzz-targets = ["dep:frankenterm-core", "frankenterm-core/fuzz"]
mcp-fuzz-targets = ["core-fuzz-targets", "frankenterm-core/mcp"]
codec-fuzz-targets = ["dep:codec"]
mux-server-fuzz-targets = [
    "codec-fuzz-targets",
    "dep:frankenterm-mux-server-impl",
    "dep:mux",
    "dep:promise",
]
scripting-fuzz-targets = ["dep:frankenterm-scripting"]

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
leb128.workspace = true
libfuzzer-sys = "0.4.10"
frankenterm-core = { path = "../crates/frankenterm-core", optional = true }
frankenterm-scripting = { workspace = true, optional = true }
frankenterm-mux-server-impl = { path = "../crates/frankenterm-mux-server-impl", optional = true }
frankenterm-term = { workspace = true }
frankenterm-escape-parser = { workspace = true, features = ["std"] }
termwiz = { workspace = true }
codec = { path = "../frankenterm/codec", optional = true, features = ["fuzzing"] }
mux = { workspace = true, optional = true }
promise = { workspace = true, optional = true }
toml = "0.8.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9.34"
rusqlite = { version = "0.38.0", features = ["bundled", "backup", "functions"] }
toon_rust.workspace = true
tempfile = "3.27.0"
# ft-ul4vi: jsonschema fuzz target. Same version pinned in
# crates/frankenterm-core dev-deps so the harness exercises the
# crate the conformance gates use.
jsonschema = { version = "0.21", default-features = false }
# ft-s96ej: ft argv fuzz target. Same version pinned in the workspace
# so the parser surface matches what `ft` itself uses at runtime.
clap = { version = "4.5.54", features = ["derive", "env"] }

[[bin]]
name = "fts_query"
path = "fuzz_targets/fts_query.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "osc_marker_parser"
path = "fuzz_targets/osc_marker_parser.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "pattern_pack_parser"
path = "fuzz_targets/pattern_pack_parser.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "pattern_pack_toml"
path = "fuzz_targets/pattern_pack_toml.rs"
doc = false
required-features = ["core-fuzz-targets"]

# ft-8hbq8: YAML+JSON sibling of pattern_pack_toml. Targets the
# attacker-reachable `.ft/patterns/*.{yaml,json}` deserialize path
# that the loader at patterns.rs:1203 dispatches to via the file
# extension. Drives the same PatternPack deserializer + validation
# gate as the production loader, minus the filesystem read.
[[bin]]
name = "pattern_pack_loader"
path = "fuzz_targets/pattern_pack_loader.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "pattern_template_interpolation"
path = "fuzz_targets/pattern_template_interpolation.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "pattern_detect_with_context_streaming"
path = "fuzz_targets/pattern_detect_with_context_streaming.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "pattern_regex_match"
path = "fuzz_targets/pattern_regex_match.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "pattern_matcher_fuzz"
path = "fuzz_targets/pattern_matcher_fuzz.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "resize_scheduler_lifecycle"
path = "fuzz_targets/resize_scheduler_lifecycle.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "config_toml_parser"
path = "fuzz_targets/config_toml_parser.rs"
doc = false
required-features = ["core-fuzz-targets"]

# ft-851up: user-supplied extension.toml parsing and .ftx ZIP package
# opening. Keeps scripting package fuzzing behind its own feature so
# harnesses can compile without enabling Lua/WASM engines.
[[bin]]
name = "extension_manifest"
path = "fuzz_targets/extension_manifest.rs"
doc = false
required-features = ["scripting-fuzz-targets"]

[[bin]]
name = "ftx_package"
path = "fuzz_targets/ftx_package.rs"
doc = false
required-features = ["scripting-fuzz-targets"]

[[bin]]
name = "ntm_importer_json"
path = "fuzz_targets/ntm_importer_json.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "recorder_event_json"
path = "fuzz_targets/recorder_event_json.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "native_events_wire"
path = "fuzz_targets/native_events_wire.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "scan_pipeline_quick"
path = "fuzz_targets/scan_pipeline_quick.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "scan_pipeline_chunked"
path = "fuzz_targets/scan_pipeline_chunked.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "simd_scan"
path = "fuzz_targets/simd_scan.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "tuning_config_toml"
path = "fuzz_targets/tuning_config_toml.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "workflow_yaml_descriptor"
path = "fuzz_targets/workflow_yaml_descriptor.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "robot_envelope_json"
path = "fuzz_targets/robot_envelope_json.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "string_parsers"
path = "fuzz_targets/string_parsers.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "snapshot_deserialize"
path = "fuzz_targets/snapshot_deserialize.rs"
doc = false
required-features = ["core-fuzz-targets"]

# ft-lb9yi: byte-compression frame decoder fuzz target. Drives
# ByteCompressor::decompress and decompress_batch with raw adversarial
# frames plus structured compressed payloads and corrupted batch headers.
[[bin]]
name = "byte_compression_frames"
path = "fuzz_targets/byte_compression_frames.rs"
doc = false
required-features = ["core-fuzz-targets"]

[[bin]]
name = "pdu_stream_decode"
path = "fuzz_targets/pdu_stream_decode.rs"
doc = false
required-features = ["codec-fuzz-targets"]

[[bin]]
name = "pdu_try_read_chunked"
path = "fuzz_targets/pdu_try_read_chunked.rs"
doc = false
required-features = ["codec-fuzz-targets"]

[[bin]]
name = "bounded_varbincode"
path = "fuzz_targets/bounded_varbincode.rs"
