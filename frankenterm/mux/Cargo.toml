[package]
name = "mux"
version = "0.1.0"
authors = ["Wez Furlong <wez@wezfurlong.org>"]
edition = "2018"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["lua", "async-asupersync"]
lua = ["dep:luahelper", "dep:mlua", "config/lua", "procinfo/lua"]
# ft-87qfi (round-3 moonshot): route the pane->render parsed-action hot path
# through a lock-free LMAX-disruptor-style SPSC staging ring (crossbeam
# ArrayQueue) so the single parser thread never blocks on the terminal mutex
# under render contention. OFF by default — the mutex path is the fallback;
# enabling this flag swaps in the ring. Clean revert = drop the flag.
disruptor-pane-io = []
no-lua = ["config/no-lua"]
# Legacy fallback path kept for staged migration/testing.
async-smol = ["config/async-smol", "frankenterm-ssh/async-smol"]
async-asupersync = [
    "config/async-asupersync",
    "promise/async-asupersync",
    "frankenterm-ssh/async-asupersync",
]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bintree.workspace = true
bitflags.workspace = true
chrono.workspace = true
chacha20poly1305.workspace = true
config = { path = "../config", default-features = false }
crossbeam.workspace = true
downcast-rs.workspace = true
fancy-regex.workspace = true
filedescriptor.workspace = true
finl_unicode.workspace = true
hmac.workspace = true
hostname.workspace = true
lazy_static.workspace = true
libc.workspace = true
log.workspace = true
lru.workspace = true
luahelper = { workspace=true, optional = true }
metrics.workspace = true
mlua = { workspace=true, optional = true }
names.workspace = true
nix = {workspace=true, features=["term"]}
parking_lot.workspace = true
percent-encoding.workspace = true
portable-pty = { workspace=true, features = ["serde_support"]}
procinfo = { path = "../procinfo", default-features = false }
promise.workspace = true
rangeset.workspace = true
serde = {workspace=true, features = ["rc", "derive"]}
sha2.workspace = true
serial2.workspace = true
shell-words.workspace = true
terminfo.workspace = true
termwiz.workspace = true
textwrap.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "rng"] }
zeroize.workspace = true
frankenterm-dynamic.workspace = true
frankenterm-sigpipe.workspace = true
# Keep ssh backend selection explicit here so runtime selection is controlled
# by mux feature flags instead of frankenterm-ssh defaults.
frankenterm-ssh = { path = "../ssh", default-features = false, features = ["libssh-rs", "ssh2"] }
frankenterm-term = { workspace=true, features=["use_serde"] }

[target."cfg(windows)".dependencies]
ntapi.workspace = true
winapi = { workspace=true, features = [
    "handleapi",
    "memoryapi",
    "psapi",
    "processthreadsapi",
    "tlhelp32",
]}

[dev-dependencies]
criterion = "0.8.2"
k9.workspace = true
promise = { workspace = true, features = ["test-support"] }
proptest = "1.8.0"
serde_json.workspace = true
tempfile.workspace = true

[[bench]]
name = "event_bus"
harness = false
