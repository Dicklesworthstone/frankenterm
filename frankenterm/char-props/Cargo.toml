[package]
authors = ["Wez Furlong"]
name = "frankenterm-char-props"
version = "0.1.3"
edition = "2021"
repository = "https://github.com/wezterm/wezterm"
description = "Unicode and other character properties"
license-file = "../../LICENSE"
documentation = "https://docs.rs/frankenterm-char-props"
keywords = ["terminal", "unicode", "nerdfonts", "emoji"]
readme = "README.md"
publish = false

[dependencies]
# `emoji_variation.rs` embeds hash state emitted by the excluded codegen crate.
# Keep its runtime on the same PHF release line or valid keys can silently miss.
# PHF 0.14 changes string hashing; upgrade only with regenerated table state.
# The table's state is 0.13's: a group bump to 0.14 (e73b0d7e4) made every
# VARIATION_MAP lookup miss, so VS15/VS16 stopped setting presentation.
# The dependabot group bump 70b0ee5ec (2026-10-19) did it again: any bump of
# this pin must regenerate emoji_variation.rs in the same change.
phf = { version = "=0.13.1", default-features = false }
serde = {workspace=true, optional=true}
ucd-trie.workspace = true

[features]
default = ["std"]
std = ["serde/std", "ucd-trie/std", "phf/std"]
use_serde = ["serde"]

[dev-dependencies]
k9.workspace = true
criterion.workspace = true
termwiz = { path = "../termwiz" }

[[bench]]
name = "wcwidth"
harness = false
