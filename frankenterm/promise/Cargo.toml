[package]
authors = ["Wez Furlong <wez@wezfurlong.org>"]
name = "promise"
version = "0.2.0"
edition = "2018"
publish = false

[dependencies]
anyhow.workspace = true
asupersync = { workspace = true, optional = true }
async-executor.workspace = true
async-io.workspace = true
async-task.workspace = true
flume.workspace = true
frankenterm-sigpipe.workspace = true
lazy_static.workspace = true
thiserror.workspace =true

[features]
# Default behavior matches the current implementation (async-io's `block_on`).
default = []

# Opt-in: use asupersync runtime for `promise::spawn::block_on`.
async-asupersync = ["dep:asupersync"]

# Exposes the retired unclassified scheduler harness only to dependent-crate
# unit tests. Shipping targets must use the bounded admission API.
test-support = []

[dev-dependencies]
proptest = "1.8.0"
