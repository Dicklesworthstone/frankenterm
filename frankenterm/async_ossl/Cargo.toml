[package]
name = "async_ossl"
version = "0.1.0"
authors = ["Wez Furlong <wez@wezfurlong.org>"]
edition = "2018"
resolver = "2"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-io = { workspace = true, optional = true }
asupersync = { workspace = true, optional = true }
futures.workspace = true

# OpenSSL vendoring is centralized here — ssh/, frankenterm-core, and frankenterm
# pull OpenSSL transitively through async_ossl (see the "centralize" note in
# frankenterm/ssh/Cargo.toml), so this is the single source of truth.
#
# ft-x1klc: vendoring on Windows builds openssl-src (OpenSSL compiled from
# source), which fails on windows runners in the build script (perl
# Locale::Maketext::Simple). ONLY Windows changes — it drops vendored and uses
# the system/SDK OpenSSL. macOS AND Linux keep `vendored` exactly as before
# (the prior dependency was unconditionally vendored on every target), so there
# is zero Mac/Linux behavior change — the gate is `not(windows)` precisely to
# preserve the existing vendored build on both Unix platforms.
[target.'cfg(not(target_os = "windows"))'.dependencies]
openssl = { workspace = true, features = ["vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
openssl.workspace = true

[features]
default = ["async-asupersync"]

async-io = ["dep:async-io"]
async-asupersync = ["dep:asupersync"]
