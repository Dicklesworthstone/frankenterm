[package]
name = "cx_propagation_lint"
version = "0.1.0"
edition = "2021"
description = "Custom lint flagging pub async fns missing &Cx in frankenterm-core (ft-t9a6q.1)"
publish = false

[lib]
name = "cx_propagation_lint"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
dylint = []

[[bin]]
name = "cx-propagation-lint"
path = "src/main.rs"

[dependencies]
syn = { version = "1.0", features = ["full", "visit", "extra-traits"] }
walkdir = "2"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"

[dev-dependencies]
syn = { version = "1.0", features = ["full", "visit", "extra-traits"] }
