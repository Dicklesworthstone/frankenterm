[package]
name = "cache_gpu_handle_lint"
version = "0.1.0"
edition = "2021"
description = "Custom lint forbidding process-global caches from transitively owning a GPU-resource handle (glyph-run-interner atlas-pinning leak class)"
publish = false

[lib]
name = "cache_gpu_handle_lint"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cache-gpu-handle-lint"
path = "src/main.rs"

[dependencies]
syn = { version = "2.0.117", features = ["full", "visit", "extra-traits"] }
walkdir = "2"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"

[dev-dependencies]
syn = { version = "2.0.117", features = ["full", "visit", "extra-traits"] }
