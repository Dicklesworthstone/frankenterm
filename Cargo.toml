# WASM runtime (optional, for scripting/extensions)
wasmtime = { version = "45.0.1", default-features = false, features = ["anyhow", "cranelift", "async", "component-model", "runtime", "std"] }
wasmtime-wasi = { version = "45.0.1", default-features = false, features = ["p1"] }

# Benchmarking
criterion = "0.8.2"

# FastMCP (optional MCP server dependencies)
asupersync = { version = "0.3.10" }
asupersync-macros = { version = "0.3.10" }
log = "0.4.32"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
glob = "0.3.3"
console = "0.16.3"
getrandom = "0.4.2"
trybuild = { version = "1.0.116", default-features = false }
# Crypto provider: ring, NOT the rustls default of aws-lc-rs (#67). aws-lc-rs
# spawns a jitter-entropy background thread whose Windows FLS teardown during
# RtlExitUserProcess trips Rust std's thread-lifecycle assertion, panicking
# ft.exe at process exit. `default-features = false` drops the `aws_lc_rs`
# feature (and thus the aws-lc-rs/aws-lc-sys crates) from the dependency graph
# entirely; `ring` is the pure-Rust/asm backend already pulled in via
# asupersync's `tls` feature (`rustls/ring`). We re-add the other rustls
# defaults (logging, std, tls12) so behavior is otherwise unchanged.
rustls = { version = "0.23.40", default-features = false, features = ["logging", "std", "tls12", "ring"] }
rustls-pemfile = "2.2.0"
fastmcp = { version = "0.3.1", git = "https://github.com/Dicklesworthstone/fastmcp_rust", rev = "1038dd4e64cc7df8ea8122dbfb8806b0b04a7130", package = "fastmcp-rust" }
fastapi = { version = "0.3.0", git = "https://github.com/Dicklesworthstone/fastapi_rust", rev = "dd49823fcb81f5c6d2bce6090b8080f33b0ac9e2", package = "fastapi-rust" }

# FrankenSearch (optional integration, enabled via frankenterm-core feature flag)
# Pinned to a specific rev of the upstream GitHub repo for reproducibility.
frankensearch = { git = "https://github.com/Dicklesworthstone/frankensearch", rev = "4a75fd706917df915e644b00248540786df438f2", package = "frankensearch", default-features = false, features = ["hybrid"] }
# Agent detection (optional integration, enabled via frankenterm-core feature flag)
franken-agent-detection = "0.1.8"

# Internal crates
frankenterm-core = { path = "crates/frankenterm-core", default-features = false }
frankenterm-redactor = { path = "crates/frankenterm-redactor", default-features = false }
# Replay sub-crate extracted from frankenterm-core under ft-y0loj.4 / ft-j1qjt.2.
# `frankenterm-core` carries this only as a dev-dep (cycle reason: tests in
# crates/frankenterm-core/tests/proptest_replay*.rs); production consumers
# such as the `ft` binary that need the moved replay_* modules must depend
# on this crate directly.
frankenterm-core-replay = { path = "crates/frankenterm-core-replay", default-features = false }
frankenterm-alloc = { path = "crates/frankenterm-alloc" }

[profile.release]
opt-level = "z"     # Conventional safe release default; explicit shipped profile inherits this
lto = true          # Link-time optimization
codegen-units = 1   # Single codegen unit for better optimization
panic = "unwind"    # Fail-safe default: audited catches remain executable
strip = true        # Size-oriented release artifact
debug = false       # No debuginfo in release artifacts

[profile.release-interactive]
# Every shipped process (`ft`, GUI, mux-server) uses this profile. In-process
# callback/task containment is a correctness contract, so these artifacts MUST
# unwind. Keep all other release knobs inherited until
# ft-interactive-systems-performance-4tenz.13 records a target-class
# latency/size A/B; this P0 changes panic semantics, not a perf arm.
inherits = "release"
panic = "unwind"

[profile.release-abort-probe]
# Negative-control artifact used only by the panic-contract subprocess gate.
# Keeping abort behind an explicit name means an operator's conventional
# `cargo build --release` cannot silently disable audited recovery boundaries.
inherits = "release"
panic = "abort"

[profile.release-perf]
# Round-4 gauntlet A/B profile. NEVER bench on `--release` (opt-level="z", size-optimized):
# size-opt distorts hot-loop codegen and invalidates any perf claim (keep-gate rule 3).
# Use thin LTO (not the shipped fat `lto=true`) so each A/B arm rebuilds fast on RCH workers;
# relative before/after deltas stay valid because both arms use the identical profile.
# Frame pointers (set via RUSTFLAGS="-C force-frame-pointers=yes" in the bench-AB driver) keep
# flamegraphs attributable. Inherit directly from the workspace's canonical
# `release` profile, then repeat the panic contract explicitly; this keeps the
# benchmark identity portable without depending on custom-profile inheritance
# chaining.
inherits = "release"
opt-level = 3
lto = "thin"
debug = "line-tables-only"
panic = "unwind"
# The inherited release profile strips symbols. That would discard the line
# tables this measurement profile explicitly requests and make sampled stacks
# needlessly opaque, so preserve them for attribution-quality A/B evidence.
strip = "none"

[profile.release.package.frankenterm-fuzz]
debug = 1

# [patch.crates-io] redirects crates.io-sourced deps to pinned upstream GitHub revs
# so the graph single-sources and resolves on any machine (CI runners, cargo install,
# external contributors). Do NOT use absolute /dp/... path patches: they break every
# build outside the dev fleet (and CI's --locked jobs), since /dp only exists there.
#
# asupersync no longer needs a patch here: 0.3.10 is published on crates.io, so
# frankenterm's own crates depend on it by version (see [workspace.dependencies]) and
# the fastmcp/fastapi/frankensearch deps resolve that same registry 0.3.10 — the whole
# graph unifies on a single source without any git-rev redirect.
[patch.crates-io]
# k9 0.12.0 on crates.io still pulls terminal_size 0.2 -> rustix 0.37, whose
# feature probe enables removed rustc_* layout attributes on current nightly.
# The pinned upstream revision keeps the same k9 version but updates terminal_size to 0.4.
k9 = { git = "https://github.com/aaronabramov/k9", rev = "db63bcd7f6766051f3767b48b5e05cf1f8fffc7c" }
# FastMCP and FastAPI request rich_rust from crates.io. Patch that source to the
# reviewed 0.2.2 revision that carries the repaired `time` bound; patching the
# FastMCP Git source itself cannot affect a crates.io dependency.
rich_rust = { git = "https://github.com/Dicklesworthstone/rich_rust", rev = "b0b298fca7ea29d20cac4014dd6665b234685037" }
