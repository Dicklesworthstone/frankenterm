[package]
name = "ftbench"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
frankenterm-term = { path = "../../../../frankenterm/term" }
frankenterm-escape-parser = { path = "../../../../frankenterm/escape-parser" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = "none"
panic = "unwind"
