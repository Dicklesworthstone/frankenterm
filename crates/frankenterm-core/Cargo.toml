[package]
name = "frankenterm-core"
description = "Core library for FrankenTerm - swarm-native terminal platform for AI agent fleets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["terminal", "frankenterm", "automation", "ai-agents"]
categories = ["development-tools"]
autobenches = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
emojis.workspace = true
# ft-i2eni.3: production `tokio` dependency removed (the line
# previously read `tokio.workspace = true`). frankenterm-core's
# canonical async runtime is asupersync via `runtime_async`; direct
# tokio usage is forbidden by AGENTS.md doctrine and enforced via
# deny.toml's [bans] rule. The dev-dep `tokio = { features =
# ["test-util"] }` further down stays for now (legacy criterion
# `async_tokio` integration); a follow-on bead drops the dev-dep
# once those benches migrate.
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
frankenterm-alloc.workspace = true
frankenterm-core-resource-types = { path = "../frankenterm-core-resource-types" }
frankenterm-core-error-types = { path = "../frankenterm-core-error-types" }
frankenterm-core-cass-types = { path = "../frankenterm-core-cass-types" }
# ft-rqu5e / ft-8nqx0 Phase 1: leaf crate for audit / forensic / evidence
# DTOs (forensic_export + traceability_verification — both confirmed
# leaf-clean per the ft-8nqx0 boundary scan). Re-exported from
# `frankenterm-core` so `frankenterm_core::forensic_export::*` and
# `frankenterm_core::traceability_verification::*` paths continue to
# resolve unchanged.
frankenterm-core-audit-types = { path = "../frankenterm-core-audit-types" }
# ft-2z15d / ft-y0loj.5.D.2: leaf crate of caut wrapper types
# (CautService / CautUsage / CautRefresh / CautAccountUsage / CautError).
# Re-exported below from `crate::caut::*` so existing import paths keep
# resolving. Companion of the cass-types leaf (ft-8cg6y); together they
# unblock the mcp/connector tier-2 extraction.
frankenterm-core-caut-types = { path = "../frankenterm-core-caut-types" }
frankenterm-core-connector-types = { path = "../frankenterm-core-connector-types" }
frankenterm-core-config-types = { path = "../frankenterm-core-config-types" }
frankenterm-core-mcp = { path = "../frankenterm-core-mcp", default-features = false, optional = true }
frankenterm-core-policy-types = { path = "../frankenterm-core-policy-types" }
# ft-j1qjt.1: leaf crate of replay_decision_graph (DecisionType /
# DecisionEvent / DecisionGraph / DecisionNode / CausalEdge / EdgeType).
# Re-exported from `frankenterm-core` so existing
# `crate::replay_decision_graph::*` paths keep resolving. Breaks one of
# the two `core → replay` back-edges flagged in
# docs/proposals/ft-j1qjt-replay-tier1-blocker.md.
frankenterm-core-replay-types = { path = "../frankenterm-core-replay-types" }
frankenterm-core-telemetry-types = { path = "../frankenterm-core-telemetry-types" }
# br-ft-kxopr: x11 resize-coalescing types extracted to a leaf sub-crate
# so vendored frankenterm/window/ can depend on them directly without
# inverting the layering.
frankenterm-core-x11-resize-types = { path = "../frankenterm-core-x11-resize-types" }
# br-ft-kxopr: atlas bin-packing extracted to a leaf sub-crate for the
# same reason — vendored frankenterm/window/src/bitmaps/atlas.rs imports
# the packer types directly from this crate now (was: via frankenterm_core).
frankenterm-core-atlas-pack-types = { path = "../frankenterm-core-atlas-pack-types" }

# Pattern matching
aho-corasick.workspace = true
memchr.workspace = true
fancy-regex.workspace = true
regex.workspace = true
bloomfilter.workspace = true

# Approval tokens and plan hashing
chacha20poly1305.workspace = true
rand.workspace = true
sha2.workspace = true
hex = "0.4"

# Database
rusqlite.workspace = true

# Config
toml.workspace = true
serde_yaml.workspace = true

# Directory paths
dirs = "6.0.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# File locking
fs2.workspace = true
flate2.workspace = true
zstd.workspace = true

base64 = "0.22.1"
crossbeam.workspace = true
shlex.workspace = true
shell-words.workspace = true

# FrankenTerm crates (optional, in-tree ex-WezTerm)
codec = { workspace = true, optional = true, features = ["async-asupersync"] }
config = { workspace = true, optional = true }
mux = { workspace = true, optional = true }
frankenterm-term = { workspace = true, optional = true }

# TUI (optional, behind feature)
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

# FrankenTUI (optional, migration target — see docs/adr/)
ftui = { workspace = true, optional = true }
ftui-core = { git = "https://github.com/Dicklesworthstone/frankentui", rev = "18facd3f2a2c51b8b06ff589e6b905e6a63f5a96", optional = true }
ftui-render = { git = "https://github.com/Dicklesworthstone/frankentui", rev = "18facd3f2a2c51b8b06ff589e6b905e6a63f5a96", optional = true }
ftui-layout = { git = "https://github.com/Dicklesworthstone/frankentui", rev = "18facd3f2a2c51b8b06ff589e6b905e6a63f5a96", optional = true }
ftui-style = { git = "https://github.com/Dicklesworthstone/frankentui", rev = "18facd3f2a2c51b8b06ff589e6b905e6a63f5a96", optional = true }
ftui-widgets = { git = "https://github.com/Dicklesworthstone/frankentui", rev = "18facd3f2a2c51b8b06ff589e6b905e6a63f5a96", optional = true }
ftui-runtime = { git = "https://github.com/Dicklesworthstone/frankentui", rev = "18facd3f2a2c51b8b06ff589e6b905e6a63f5a96", optional = true }
ftui-backend = { git = "https://github.com/Dicklesworthstone/frankentui", rev = "18facd3f2a2c51b8b06ff589e6b905e6a63f5a96", optional = true }

# MCP server (optional, behind feature)
fastmcp = { workspace = true, optional = true }
toon_rust = { workspace = true, optional = true }
# Web server (optional, behind feature)
fastapi = { workspace = true, optional = true }
# Sync (optional, behind feature)
asupersync = { workspace = true, features = ["tls"] }
# Distributed mode (optional, behind feature)
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }
# Lexical search (optional, behind feature)
tantivy = { workspace = true, optional = true }
nix = { workspace = true, optional = true, features = ["fs"] }
# FrankenSearch integration (optional, behind feature)
frankensearch = { workspace = true, optional = true }
# Agent detection integration (optional, behind feature)
franken-agent-detection = { workspace = true, optional = true }
# FrankenRedis session integration (optional, behind feature)
# Pin exact crate versions while sourcing code from the source-of-truth git repo.
fr-store = { version = "=0.1.0", git = "https://github.com/Dicklesworthstone/frankenredis", rev = "7b00450d924e8048073745736356ae0e45a592af", optional = true }
fr-protocol = { version = "=0.1.0", git = "https://github.com/Dicklesworthstone/frankenredis", rev = "7b00450d924e8048073745736356ae0e45a592af", optional = true }
fr-config = { version = "=0.1.0", git = "https://github.com/Dicklesworthstone/frankenredis", rev = "7b00450d924e8048073745736356ae0e45a592af", optional = true }
fr-expire = { version = "=0.1.0", git = "https://github.com/Dicklesworthstone/frankenredis", rev = "7b00450d924e8048073745736356ae0e45a592af", optional = true }
fr-persist = { version = "=0.1.0", git = "https://github.com/Dicklesworthstone/frankenredis", rev = "7b00450d924e8048073745736356ae0e45a592af", optional = true }

# Sharded concurrent map — lock-free per-shard access for hot paths
# like PaneTierClassifier::on_pane_output (ft-x2fvv).
dashmap = "6.1"

# Semantic search (optional, behind feature)
tokenizers = { version = "0.21", optional = true }
safetensors = { version = "0.5", optional = true }
half = { version = "2.4", optional = true, features = ["num-traits"] }
fastembed = { version = "5.11", optional = true }
rmp-serde = { version = "1.3", optional = true }
roaring = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
proptest = "1.8.0"
tempfile = "3.23.0"
criterion = { version = "0.7.0", features = ["async_tokio"] }
loom = "0.7"
rcgen = { workspace = true }
insta = { version = "1.43", features = ["json", "redactions"] }
toon_rust = { workspace = true }
# ft-5ikbd: runtime JSON Schema validator for robot envelope conformance.
# Pure-Rust, no system deps, supports Draft 2020-12 (matches the
# committed wa-robot-*.json header).
jsonschema = { version = "0.21", default-features = false }
# ft-y0loj.1: integration tests under #![cfg(feature = "recorder-lexical")]
# import the lexical-search modules from the new sub-crate. This is a
# dev-only edge — production code does NOT depend on the sub-crate.
frankenterm-core-tantivy = { path = "../frankenterm-core-tantivy" }
# ft-y0loj.2 / ft-mr35k: proptest_ars_*.rs integration tests import from
# the new ars sub-crate. Cargo allows dev-dep cycles; production code
# does NOT depend on this sub-crate.
frankenterm-core-ars = { path = "../frankenterm-core-ars" }
# ft-y0loj.4 / ft-j1qjt.2: 24 replay_* modules extracted; tests in this
# crate that exercise them (proptest_replay*.rs) resolve via dev-dep.
frankenterm-core-replay = { path = "../frankenterm-core-replay" }
# ft-y0loj.3: fleet_dashboard module extracted; proptest_fleet_dashboard.rs
# resolves via dev-dep cycle (production code does NOT depend on this).
frankenterm-core-fleet = { path = "../frankenterm-core-fleet" }
# br-ft-88mve: `#[lab_runtime_test]` proc-macro for the LabRuntime
# fixture (test_fixtures/lab_runtime.rs). Dev-only — production
# code uses the fixture's function form directly.
frankenterm-core-test-macros = { path = "../frankenterm-core-test-macros" }

