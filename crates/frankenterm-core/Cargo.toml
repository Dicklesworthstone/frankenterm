[features]
# Everything is on by default — ft is a standalone terminal platform with no feature gates.
# Use `--no-default-features` to compile a minimal build.
default = [
    "agent-detection",
    "agent-mail",
    "asupersync-runtime",
    "browser",
    "cass-export",
    "disk-pressure",
    "distributed",
    "frankensearch",
    "vendored",
    "mcp",
    "mcp-client",
    "metrics",
    "native-wezterm",
    "recorder-lexical",
    "redis-session",
    "semantic-search",
    "session-resume",
    "streaming",
    "subprocess-bridge",
    "sync",
    "ftui",
    "tui-dashboard",
    "tui-widgets",
    "vc-export",
    "web",
]
# Public feature flags (stable surface)
frankenterm = ["frankenterm-deps"]
vendored = ["frankenterm"]  # backward compat alias
browser = ["browser-automation"]
mcp = ["mcp-server"]
mcp-client = ["dep:fastmcp", "dep:frankenterm-core-mcp", "frankenterm-core-mcp/mcp-client"]
web = ["dep:fastapi"]
streaming = ["web"]
tui = ["dep:ratatui", "dep:crossterm"]
tui-oracle = ["tui"]
ftui = ["dep:ftui"]
tui-widgets = ["dep:ftui-render", "dep:ftui-layout", "dep:ftui-style", "dep:ftui-widgets"]
tui-dashboard = ["tui-widgets", "dep:ftui-runtime", "dep:ftui-core", "dep:ftui-backend"]
rollout = ["tui-oracle", "ftui"]
metrics = []
native-wezterm = []
# Test/fuzz-only feature: exposes private parsers (e.g. native_events::
# decode_wire_event_for_fuzz) so the frankenterm-fuzz crate can target
# them without leaking the wire-format surface to production builds.
# Activated by the [[bin]] entries in fuzz/Cargo.toml.
fuzz = []
distributed = [
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:x509-parser",
]
sync = []
# Test/bench selector: gates ~50 labruntime tests and ~10 benches that
# require asupersync-specific Cx-aware APIs (sleep_with_cx, reserve(&cx),
# etc.). Asupersync IS the sole async runtime in production code paths
# (ft-xbnl0.2.5), so the feature does NOT change which production code
# compiles — but several test/bench files use #![cfg(feature =
# "asupersync-runtime")] to opt into the asupersync-specific paths and
# others use #[cfg(not(...))] to keep legacy tokio-shape probes alive
# for the migration-conformance suite. ft-f6vhg verified that simply
# deleting the feature breaks ~50 test files; full retirement requires
# untangling the paired cfg(not(...)) bodies first. Don't call this a
# no-op until those are gone.
asupersync-runtime = []
recorder-lexical = ["dep:tantivy"]
frankensqlite-recorder = []
# br-ft-kcdqp: feature gate for the StorageBackend implementation
# backed by frankensqlite (vs the default rusqlite). Default OFF;
# the implementation is currently a stub awaiting frankensqlite
# Phase 5+ release. Run scripts/check_frankensqlite_readiness.py
# to verify upstream readiness before flipping this feature on.
frankensqlite-backend = []
disk-pressure = ["dep:nix"]
semantic-search = ["dep:tokenizers", "dep:safetensors", "dep:half", "dep:fastembed", "dep:rmp-serde"]
# Feature gate for FrankenSearch integration.
frankensearch = ["dep:frankensearch"]
# Feature gate for filesystem-based coding-agent installation probes.
agent-detection = ["dep:franken-agent-detection"]
# Feature gate for FrankenRedis-backed session state primitives.
redis-session = [
    "dep:fr-store",
    "dep:fr-protocol",
    "dep:fr-config",
    "dep:fr-expire",
    "dep:fr-persist",
]
# Feature gate for cross_agent_session_resumer integration (vendored IR types).
session-resume = []
# Placeholder feature gate for test files referencing unimplemented types (journal, tx, etc.)
__journal_types_placeholder = []
# Feature gate for generic subprocess bridge foundation.
subprocess-bridge = []
# Feature gate for mcp_agent_mail_rust coordination bridge.
agent-mail = ["subprocess-bridge"]
# Feature gate for FrankenTerm session/content export consumed by cass connectors.
cass-export = []
# Feature gate for vibe_cockpit telemetry export bridge.
vc-export = ["subprocess-bridge"]

# Optional heavy integrations - feature-gated (internal)
frankenterm-deps = ["dep:codec", "dep:config", "dep:mux", "dep:frankenterm-term"]
vendored-wezterm = ["frankenterm-deps"]  # backward compat alias
browser-automation = []
mcp-server = ["dep:fastmcp", "dep:toon_rust"]
