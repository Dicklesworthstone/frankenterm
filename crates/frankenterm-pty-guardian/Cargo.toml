[package]
name = "frankenterm-pty-guardian"
description = "Opt-in standalone Unix PTY lifetime guardian for FrankenTerm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["terminal", "frankenterm", "pty", "multiplexer"]
categories = ["command-line-utilities", "development-tools"]
publish = false
build = "build.rs"

[[bin]]
name = "frankenterm-pty-guardian"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
frankenterm-build-identity.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[build-dependencies]
frankenterm-build-identity.workspace = true

[target.'cfg(unix)'.dependencies]
getrandom.workspace = true
frankenterm-sigpipe.workspace = true
libc.workspace = true
mio = { workspace = true, features = ["net", "os-ext", "os-poll"] }
mux.workspace = true
nix = { workspace = true, features = ["feature", "fs", "process", "signal", "user"] }
portable-pty = { workspace = true, features = ["serde_support"] }
rustix = { workspace = true, features = ["process"] }
sha2.workspace = true
uuid = { workspace = true, features = ["rng", "v4"] }

[dev-dependencies]
frankenterm-term = { workspace = true, features = ["use_serde"] }
tempfile.workspace = true
