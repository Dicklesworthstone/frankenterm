[package]
name = "frankenterm"
description = "FrankenTerm CLI - swarm-native terminal platform for AI agent fleets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["terminal", "frankenterm", "automation", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ft"
path = "src/main.rs"

[[test]]
name = "e2e_workflow_trigger"
path = "../../tests/e2e_workflow_trigger.rs"

[lints]
workspace = true

[dependencies]
frankenterm-core = { workspace = true, default-features = false }
# GH#75: broken-pipe (EPIPE) panic-to-exit(141) handling; `ft list | head`
# must not unwind through or crash the shipped process.
frankenterm-sigpipe = { workspace = true }
# ft-y0loj.4 / ft-j1qjt.2: 24 replay_* modules moved out of frankenterm-core
# to this sub-crate. `ft` consumes a handful of them directly (replay diff /
# inspect / report / artifact-registry CLI subcommands in main.rs), so we
# depend on the sub-crate as a regular dep here. `frankenterm-core` itself
# only dev-depends on this crate, so there's no production cycle.
frankenterm-core-replay = { workspace = true, default-features = false }
frankenterm-alloc = { workspace = true, optional = true }
frankenterm-client.workspace = true
mux.workspace = true
# Portable nonblocking socket-pair capture for finite doctor subprocess probes
# (also used by the EPIPE integration-test substrate).
filedescriptor.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
clap.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true


anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fancy-regex.workspace = true
toml.workspace = true
toml_edit.workspace = true
toon_rust.workspace = true
rusqlite.workspace = true
dirs = "6.0.0"
sha2.workspace = true
hex.workspace = true
tar.workspace = true
zstd.workspace = true
asupersync = { workspace = true, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

# [round8 Windows port] openssl-sys reaches the `ft` build transitively via
# frankenterm-ssh -> libssh-rs (config depends on frankenterm-ssh
# unconditionally). Windows has no system OpenSSL, so vendor it (built from
# source via openssl-src + Strawberry Perl, mirroring release.yml's Windows
# Perl setup). Cargo feature-unification turns vendoring on for the whole
# Windows build graph; Linux/macOS keep system OpenSSL (this target dep is
# inactive there, so their builds are unchanged).
[target.'cfg(windows)'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[features]
# Round-5 test-build convenience: enables the compile-time moonshot optimizations
# that measured as WINS or neutral — Q4 lazy-captures, Q5 Teddy, M1 ANSI-DFA.
# DELIBERATELY EXCLUDES the two measured REGRESSIONS: Q6 fingerprint-dedup
# (+8.8% slower) and M5 MPHF dispatch (+69% slower) — see docs/perf-ledger/
# round5-negative-results.md. Pair with FT_MOONSHOT_ALL=1 at runtime for the
# env/config-gated optimizations (all wins/neutral, no regressions in that set).
# Default-OFF; not part of `default`.
moonshot-all = [
    "frankenterm-core/ansi-dfa-table",
    "frankenterm-core/patterns-lazy-captures",
    "frankenterm-core/teddy-prefilter",
]
# Everything is on by default — ft is a standalone terminal platform with no feature gates.
default = [
    "browser",
    "distributed",
    "vendored",
    "jemalloc",
    "mcp",
    "metrics",
    "native-wezterm",
    "semantic-search",
    "session-resume",
    "subprocess-bridge",
    "sync",
    "ftui",
    "tui-dashboard",
    "tui-widgets",
    "web",
    "redis-session",
    "asupersync-runtime",
]
frankenterm = ["frankenterm-core/frankenterm"]
vendored = ["frankenterm", "frankenterm-core/vendored"]  # backward compat alias
browser = ["frankenterm-core/browser"]
mcp = ["frankenterm-core/mcp"]
web = ["frankenterm-core/web"]
tui = ["frankenterm-core/tui"]
tui-oracle = ["tui", "frankenterm-core/tui-oracle"]
ftui = ["frankenterm-core/ftui"]
tui-widgets = ["frankenterm-core/tui-widgets"]
tui-dashboard = ["frankenterm-core/tui-dashboard", "tui-widgets"]
rollout = ["frankenterm-core/rollout", "tui-oracle", "ftui"]
metrics = ["frankenterm-core/metrics"]
native-wezterm = ["frankenterm-core/native-wezterm"]
distributed = ["frankenterm-core/distributed"]
subprocess-bridge = ["frankenterm-core/subprocess-bridge"]
sync = ["frankenterm-core/sync"]
asupersync-runtime = ["frankenterm-core/asupersync-runtime"]
semantic-search = ["frankenterm-core/semantic-search"]
session-resume = ["frankenterm-core/session-resume"]
redis-session = ["frankenterm-core/redis-session"]
jemalloc = ["dep:frankenterm-alloc", "frankenterm-alloc/jemalloc"]

[dev-dependencies]
assert_cmd = "2.2.2"
memchr.workspace = true
predicates = "3.1.4"
tempfile = "3.27.0"
