[package]
name = "frankenterm-mux-server-impl"
description = "FrankenTerm headless mux server support library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[features]
default = []
io-uring = []

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
asupersync.workspace = true
async_ossl = { workspace = true, default-features = false, features = ["async-asupersync"] }
codec = { workspace = true, default-features = false, features = ["async-asupersync"] }
config.workspace = true
dns-lookup.workspace = true
futures.workspace = true
hostname.workspace = true
lazy_static.workspace = true
libc.workspace = true
log.workspace = true
mux.workspace = true
portable-pty = { workspace=true, features = ["serde_support"]}
parking_lot.workspace = true
promise.workspace = true
rangeset.workspace = true
rcgen.workspace = true
termwiz = { workspace=true, features=["use_serde"] }
url.workspace = true
wezterm-client.workspace = true
wezterm-term = { workspace=true, features=["use_serde"] }
wezterm-uds = { workspace = true, default-features = false, features = ["async-asupersync"] }

[target."cfg(windows)".dependencies]
winapi = { workspace=true, features = [ "winuser" ]}

[lints]
workspace = true
