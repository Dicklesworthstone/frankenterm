[package]
name = "frankenterm-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
description = "FrankenTerm GUI — custom terminal emulator binary"
publish = false
build = "build.rs"

[[bin]]
name = "frankenterm-gui"
path = "src/gui_main_target.rs"
test = false

[lib]
name = "frankenterm_gui"
path = "src/lib.rs"

[[test]]
name = "gpu_regression"
path = "tests/gpu_regression.rs"
harness = false

[[test]]
name = "input_to_photon_bound"
path = "../../tests/input_to_photon_bound.rs"

# `native_bridge` is binary-owned, but the GUI binary has `test = false`.
# Compile that same production source as a test target so its in-file lifecycle
# and authenticated-socket tests are part of the normal test graph. This
# harness does not execute `main` or launch a GUI window.
[[test]]
name = "native_bridge"
path = "src/native_bridge.rs"

# `glyphcache` is binary-owned while the production binary intentionally keeps
# `test = false`. This opt-in harness compiles the same `src/main.rs` module
# graph under Rust's test runner; the generated harness replaces the application
# entry point, so the target itself does not call `main`. Individual included
# tests can still initialize GUI state, so automation must run only exact test
# bodies audited as frontend/window/event-loop free. Keep it feature-gated so
# ordinary workspace tests retain their existing target graph.
[[test]]
name = "glyphcache_unit"
path = "src/glyphcache_test_target.rs"
required-features = ["internal-glyphcache-test-harness"]

[[test]]
name = "ssim_parity"
path = "tests/ssim_parity.rs"
required-features = ["gui-system-libs"]

[[bench]]
name = "input_to_photon"
path = "benches/renderer_slo/input_to_photon.rs"
harness = false
required-features = ["headless-render"]

[[bench]]
name = "ssim_parity"
path = "benches/renderer_slo/ssim_parity.rs"
harness = false

[features]
# `jemalloc` ships in the default set so release builds get the same
# fragmentation-resistant allocator as `frankenterm` and `frankenterm-mux-server`.
# Heap-profiling builds with `dhat-heap` MUST disable jemalloc explicitly:
#   cargo build --no-default-features --features dhat-heap
# A compile_error! in main.rs enforces that both features cannot be on at once
# (each defines a `#[global_allocator]`). See ft-tkxpi.
default = ["jemalloc"]
jemalloc = ["dep:frankenterm-alloc", "frankenterm-alloc/jemalloc"]
wayland = ["window/wayland"]
headless-render = []
dhat-heap = ["dep:dhat"]
dhat-ad-hoc = ["dep:dhat"]
debug-cell-crc = []
debug-cell-diff = ["debug-cell-crc"]
fail-on-cell-mismatch = ["debug-cell-crc", "debug-cell-diff"]
# Integration tests in this crate cause Cargo to link the GUI executable.
# Keep the SSIM corpus proof available through the lib test harness on workers
# that intentionally lack XCB/xkb runtime development packages.
gui-system-libs = []
# Empty opt-in gate for the binary-owned unit-test harness above.
internal-glyphcache-test-harness = []

[build-dependencies]
anyhow.workspace = true
frankenterm-build-identity.workspace = true

[dependencies]
# Core library
frankenterm-core = { workspace = true, features = ["native-wezterm"] }
# GH#75: broken-pipe (EPIPE) panic-to-exit(141) handling for piped stdout
# (e.g. `frankenterm-gui show-keys | head`).
frankenterm-sigpipe.workspace = true

# Allocator wiring (jemalloc by default for release builds; gated behind the
# `jemalloc` feature so dhat-heap builds can opt out). ft-tkxpi.
frankenterm-alloc = { workspace = true, optional = true }

# Vendored FrankenTerm crates (ex-WezTerm)
ahash.workspace = true
codec = { workspace = true, features = ["async-asupersync"] }
config.workspace = true
filedescriptor.workspace = true
frecency.workspace = true
lfucache.workspace = true
luahelper.workspace = true
mux.workspace = true
portable-pty = { workspace = true, features = ["serde_support"] }
promise.workspace = true
rangeset.workspace = true
ratelim.workspace = true
tabout.workspace = true
termwiz-funcs.workspace = true
termwiz.workspace = true
umask.workspace = true
mux-lua.workspace = true
url-funcs.workspace = true
# Workspace aliases (wezterm-* -> frankenterm-* packages)
# NOTE: frankenterm-dynamic is the canonical dep name. The extern crate alias
# in main.rs provides `wezterm_dynamic` for vendored code that uses the old name.
# Do NOT add wezterm-dynamic here — it would create a duplicate dep error.
wezterm-bidi.workspace = true
wezterm-blob-leases = { workspace = true, features = ["simple_tempdir"] }
frankenterm-client.workspace = true
frankenterm-dynamic.workspace = true
frankenterm-font.workspace = true
wezterm-gui-subcommands.workspace = true
frankenterm-open-url.workspace = true
wezterm-ssh.workspace = true
wezterm-term.workspace = true
frankenterm-toast-notification.workspace = true
window.workspace = true
# FrankenTerm mux server (uses frankenterm_mux_server_impl in code)
frankenterm-mux-server-impl.workspace = true

# Standard dependencies
anyhow.workspace = true
base64.workspace = true
bitflags.workspace = true
bytemuck.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
chrono.workspace = true
clap.workspace = true
colorgrad.workspace = true
dirs-next.workspace = true
downcast-rs.workspace = true
emojis.workspace = true
env_logger.workspace = true
euclid.workspace = true
fastrand.workspace = true
finl_unicode.workspace = true
flume.workspace = true
fs2.workspace = true
futures.workspace = true
hdrhistogram.workspace = true
http_req.workspace = true
image.workspace = true
lazy_static.workspace = true
libc.workspace = true
log.workspace = true
metrics.workspace = true
dhat = { workspace = true, optional = true }
mlua = { workspace = true, features = ["send", "serialize"] }
nucleo-matcher.workspace = true
ordered-float.workspace = true
parking_lot.workspace = true
rayon.workspace = true
regex.workspace = true
rustix.workspace = true
serde = { workspace = true, features = ["rc", "derive"] }
serde_json.workspace = true
sha2.workspace = true
shlex.workspace = true
tempfile.workspace = true
terminfo.workspace = true
textwrap.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "rng"] }
walkdir.workspace = true
wgpu.workspace = true

[target.'cfg(all(unix, any(target_vendor = "apple", target_os = "linux", target_os = "android", target_os = "freebsd", target_os = "dragonfly")))'.dependencies]
socket2 = { workspace = true, features = ["all"] }

[target.'cfg(windows)'.dependencies]
shared_library.workspace = true
winapi = { workspace = true, features = [
    "winuser",
    "consoleapi",
    "handleapi",
    "fileapi",
    "namedpipeapi",
    "synchapi",
    "winsock2",
]}
windows = { workspace = true, features = [
    "Win32_UI_Shell",
]}

[dev-dependencies]
benchmarking = "0.4.13"
criterion.workspace = true
k9.workspace = true
proptest = "1.8.0"

# NOTE: Workspace lints intentionally omitted - vendored GUI code carries
# upstream style that does not conform to our pedantic clippy profile.
# Linting will be incrementally enabled as the code is FrankenTerm-ified.
