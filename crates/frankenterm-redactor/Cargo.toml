[package]
name = "frankenterm-redactor"
description = "Secret redaction primitives for FrankenTerm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["terminal", "frankenterm", "redaction", "security"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
# ft-aznq6: the shared `redactor.rs` source finds streaming anchor occurrences
# with a single case-insensitive Aho-Corasick pass, so this shim crate needs the
# same dependency `frankenterm-core` has.
aho-corasick = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive", "std", "alloc"] }
serde_json = { workspace = true }

[dev-dependencies]
hex.workspace = true
proptest = "1.8.0"
sha2.workspace = true
